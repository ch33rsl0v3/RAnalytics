<!doctype html><html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"><style>
:root{color-scheme:dark;--bg:#0b0e13;--surface:#141a22;--surface-2:#10151c;--line:#232c38;
--ink:#e9eff6;--mut:#8b97a6;--accent:#37c2ff;--accent-ink:#04121c;--ok:#46c266;--warn:#e3b341;--bad:#f0603a;
--disp:'Sora',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--accent);text-decoration:none;cursor:pointer}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,14,19,.85);
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--ink)}
.spark{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs a{font-size:14px;font-weight:500;color:var(--mut);border-radius:7px;padding:7px 16px}
.tabs a.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.who{font-size:13px;color:var(--mut)}
.btn{display:inline-block;font-family:var(--body);font-weight:600;font-size:14px;padding:10px 18px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.back{color:var(--mut);font-size:13px}
.center{min-height:calc(100% - 58px);display:grid;place-items:start center;padding:40px 20px}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.card.wide{max-width:620px}
.card h2{font-size:21px;font-weight:600;margin-bottom:4px}.card .sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);font-family:var(--mono);font-size:13.5px}
.inp:focus{outline:none;border-color:var(--accent)}
.agree{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;color:var(--mut);margin-top:16px;white-space:pre-line;max-height:150px;overflow:auto}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:14px}.consent input{margin-top:3px;accent-color:var(--accent)}
.hint{color:var(--mut);font-size:12.5px;margin-top:12px}.err{color:var(--bad);font-size:13px;margin-top:10px}
.actions{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.guide{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:13px 15px;background:var(--surface-2);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide ol{margin:0;padding:14px 16px 14px 34px;display:grid;gap:9px;font-size:13.5px}
.guide code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--accent)}
.guide .warn{color:var(--warn);font-size:12.5px;padding:0 16px 14px;margin:0}
.page{max-width:1080px;margin:0 auto;padding:24px 20px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ptop h2{font-size:20px;font-weight:700}
.sec{margin-bottom:26px}.sec h3{font-size:15px;font-weight:600;margin-bottom:4px}.sec .cap{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.r{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:11px 15px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}.r .nm{font-size:14px}.r .nm small{color:var(--mut);display:block;font-size:12px;margin-top:1px}
.r .ccu{font-family:var(--mono);font-size:13px;text-align:right}.r .gr{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ok);text-align:right;min-width:52px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tcard .t{font-family:var(--mono);font-size:14px}.tcard .g{font-family:var(--mono);color:var(--ok);font-weight:600;font-size:13px}
.tcard small{color:var(--mut);font-size:12px;display:block;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{font-family:var(--disp);font-size:30px;font-weight:700;display:block;line-height:1}.kpi span{font-size:12.5px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.chip{font-size:13px;padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th,td{padding:11px 12px;text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--line);font-size:12.5px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
tbody tr{border-top:1px solid var(--line)}tbody tr:hover{background:var(--surface)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn,.chip,.tabs a,select.inp{transition:background .15s,border-color .15s,color .15s,box-shadow .15s,filter .15s}
.btn.primary:not([disabled]):hover{filter:brightness(1.12);box-shadow:0 0 0 3px rgba(55,194,255,.25)}
.btn.ghost:not([disabled]):hover{border-color:var(--accent);color:var(--accent)}
a.chip:hover,button.chip:not([disabled]):hover{border-color:var(--accent);color:var(--accent);background:rgba(55,194,255,.1)}
a.chip.on:hover{color:var(--accent-ink);background:var(--accent)}
.chip.danger:not([disabled]):hover{border-color:var(--bad);color:var(--bad);background:rgba(240,96,58,.1)}
.tabs a:not(.active):hover{color:var(--ink);background:var(--surface)}
select.inp:hover{border-color:var(--accent)}
.consent a{text-decoration:underline;text-underline-offset:3px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:80vh;
display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.modal .txt{padding:16px 18px;overflow:auto;white-space:pre-line;font-size:13.5px;color:var(--mut)}
td.name a{color:var(--ink)}td.name a:hover{color:var(--accent)}
.stud{color:var(--mut)}.badge{font-weight:600;font-size:12.5px}
.vcard{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--surface)}
.vcard .lab{font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.vcard .big{font-family:var(--disp);font-weight:600;font-size:18px;margin-top:4px}.vcard p{margin:6px 0 0}
.funnel{display:grid;gap:9px;margin-top:12px}
.frow{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:12px;font-size:13.5px}

.fill{height:100%;border-radius:6px}.frow .val{font-family:var(--mono);text-align:right;color:var(--mut)}
@media(max-width:560px){.frow{grid-template-columns:110px 1fr 50px}}

.dash{flex:1;display:block;width:100%;border:0;background:var(--bg)}

#app{min-height:100%}
body:has(.dash) #app{flex:1;display:flex;flex-direction:column;min-height:0}
.boot{min-height:100%;display:grid;place-items:center;color:var(--mut);font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.livebar{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin:-4px 0 14px}
.dot{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--ok)}
tbody tr.go{cursor:pointer}
footer.site{color:var(--mut);font-size:12px;text-align:center;padding:18px}
.gi{border-radius:8px;flex:none;background:var(--surface-2);display:inline-block;object-fit:cover;vertical-align:middle}
.glink{color:var(--ink)}.glink:hover{color:var(--accent)}
.gcell{display:flex;align-items:center;gap:10px;min-width:0}
.spark{display:inline-block;vertical-align:middle}
.chart{position:relative;margin:0}
.chart .legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 4px;font-size:12.5px;color:var(--mut)}
.chart .lg{display:inline-flex;align-items:center;gap:6px}
.chart .ax{font-size:11px;fill:var(--mut);font-family:var(--mono)}
.chart .dl{font-size:11.5px;fill:var(--ink)}
.tip{position:absolute;display:none;pointer-events:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
padding:8px 10px;font-size:12.5px;z-index:5;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tip .sw{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip b{float:right;margin-left:14px;font-family:var(--mono);font-weight:600}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.lvl.go,.lvl.success,.lvl.off{color:var(--ok);border-color:rgba(70,194,102,.45)}
.page.wide{max-width:1400px}
table.tight th,table.tight td{padding:9px 9px}table.tight{min-width:980px}
.watching{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.watching summary{cursor:pointer;color:var(--mut);font-size:13.5px}.watching summary:hover{color:var(--ink)}.lvl.watch{color:var(--warn);border-color:rgba(227,179,65,.45)}
.lvl.stop{color:var(--bad);border-color:rgba(240,96,58,.45)}.lvl.info{color:var(--mut);border-color:var(--line)}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.today .trow:first-child{border-top:0}.trow:hover .tname{color:var(--accent)}
.tname{font-weight:600}.ttext{color:var(--mut);font-size:13.5px;margin-top:2px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}.subnav .chip{cursor:pointer}
.sh{font-size:16px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.glist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grow{display:grid;grid-template-columns:auto minmax(0,1fr) repeat(4,74px) 90px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.grow:has(.nv + .nv + .nv + .nv + .nv + .nv){grid-template-columns:auto minmax(0,1fr) repeat(5,74px) 90px}
.grow:first-child{border-top:0}.grow:hover{background:var(--surface)}
.grow .gn{min-width:0}.grow .gn .glink,.grow .gn>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.grow .sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .nv{text-align:right;font-family:var(--mono);font-size:13px}.grow .nv i{display:block;font-style:normal;font-family:var(--body);font-size:11px;color:var(--mut)}
@media(max-width:760px){.grow,.grow:has(.nv + .nv + .nv + .nv + .nv + .nv){grid-template-columns:auto minmax(0,1fr) 64px 64px}.grow .hide-s{display:none}
.grow:has(.nv + .nv + .nv + .nv + .nv + .nv){grid-template-columns:auto minmax(0,1fr) 64px 64px 64px}}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.cards2>.vcard{margin:0}
.idea .titles{margin-top:6px;display:grid;gap:8px}
.idea .tt{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

<script>
let V = JSON.parse(document.getElementById('vault').textContent);
const C = {"OUT_EN": {"взлёт": "taking off", "растёт сейчас": "rising", "средне": "ok", "провал": "failed", "рано": "too early", "нет игроков": "no players", "сбой — перезапусти": "retry"}, "OUT_COLOR": {"взлёт": "var(--ok)", "растёт сейчас": "var(--ok)", "средне": "var(--accent)", "провал": "var(--bad)", "рано": "var(--mut)", "нет игроков": "var(--mut)", "сбой — перезапусти": "var(--bad)"}, "RANK": {"взлёт": 0, "растёт сейчас": 1, "средне": 2, "рано": 3, "провал": 4, "нет игроков": 5, "сбой — перезапусти": 6}};
const BRAND = `<div class="brand"><svg class="spark" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-9" stroke="#37c2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="5" r="2.4" fill="#46c266"/></svg>RAnalytics</div>`;
const AGREEMENT = `RAnalytics shows you Roblox market data (the Analytics tab) and a launch/advertising breakdown of your own games (the Ads tab).

For the Ads tab you connect your Roblox API key with analytics read access. The service only reads — it never changes anything in your games. By connecting the key you allow the owner to store it (encrypted) and to see your games&#x27; analytics. You can revoke access at any time, here or in the Roblox Creator Hub.

The Analytics tab needs no key. The service never changes anything in your games.`;
const $app = document.getElementById('app');
const enc = new TextEncoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? '—'
  : Math.trunc(+v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
document.addEventListener('keydown', e => { const m = document.getElementById('agm'); if (e.key === 'Escape' && m) m.classList.remove('open'); });
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ---------- crypto: AES-256-GCM boxes, key per login via PBKDF2 ----------
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function gunzip(buf) {
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
async function openBox(key, box) {
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(box.iv)}, key, unb64(box.ct));
  return gunzip(pt);
}
async function slotId(k) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('ranalytics:' + k)));
  return [...h].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
}
async function freshVault() {   // the browser / GitHub may still hold an older page (new login just added)
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/<script id="vault" type="application\/json">([\s\S]*?)<\/script>/);
    if (m) { V = JSON.parse(m[1]); return true; }
  } catch (e) {}
  return false;
}
async function unlock(k) {
  let s = V.slots[await slotId(k)];
  if (!s && await freshVault()) s = V.slots[await slotId(k)];
  if (!s) return null;
  const base = await crypto.subtle.importKey('raw', enc.encode(k), 'PBKDF2', false, ['deriveKey']);
  const ku = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: unb64(s.salt), iterations: V.iter, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  try { return JSON.parse(await openBox(ku, s)); } catch (e) { return null; }
}

// ---------- state ----------
let ME = null, KEY = null, DASH_URL = null, LIVE_ON = false, LIVE_BASE = null;
const LOCAL_APP = 'http://127.0.0.1:8750';   // the live app runs only on the owner's PC (no tunnel)

function loginView(err) {
  $app.innerHTML = `<div class="center"><div class="card">${BRAND}
    <h2 style="margin-top:14px">Sign in</h2><div class="sub">Enter your access key and accept the agreement.</div>
    <form id="lf"><div class="field"><label>Access key</label>
    <input class="inp" id="k" type="password" autocomplete="current-password" placeholder="the key you were given"></div>
    <label class="consent"><input type="checkbox" id="ag"> <span>I accept the
      <a href="#" onclick="event.preventDefault();document.getElementById('agm').classList.add('open')">user agreement</a></span></label>
    <div class="actions"><button class="btn primary" id="lb">Sign in</button></div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <p class="hint">No access key? Ask the owner. Access can be revoked at any time.</p></form></div></div>
    <div class="modal" id="agm" onclick="if(event.target===this)this.classList.remove('open')"><div class="box">
      <div class="head">User agreement<button type="button" class="chip" style="cursor:pointer"
        onclick="document.getElementById('agm').classList.remove('open')">Close</button></div>
      <div class="txt">${AGREEMENT}</div></div></div>`;
  document.getElementById('k').focus();
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const k = document.getElementById('k').value.trim();
    if (!document.getElementById('ag').checked) return loginView('Please accept the user agreement.');
    const b = document.getElementById('lb'); b.disabled = true; b.textContent = 'Checking…';
    const me = k && await unlock(k);
    if (!me) return loginView('Invalid or disabled access key. A login created just now starts working about 1–2 minutes later — try again then.');
    store.set('ranalytics.k', k); enter(k, me);
  };
}

async function enter(k, me) {
  KEY = k; ME = me;
  if (V.analytics) {
    try {
      const ka = await crypto.subtle.importKey('raw', unb64(me.ka), 'AES-GCM', false, ['decrypt']);
      DASH_URL = URL.createObjectURL(new Blob([await openBox(ka, V.analytics)], {type: 'text/html'}));
    } catch (e) { DASH_URL = null; }
  }
  if (V.market) {
    try {
      const ka = await crypto.subtle.importKey('raw', unb64(me.ka), 'AES-GCM', false, ['decrypt']);
      MK = JSON.parse(await openBox(ka, V.market));
    } catch (e) { MK = null; }
  }
  pingLive();
  window.onhashchange = route; route();
}

function logout() { store.del('ranalytics.k'); KEY = ME = null; location.hash = ''; loginView(); }

// ---------- live app (the owner's PC only): connect / delete keys, admin actions ----------
async function ping(base) {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(base.replace(/\/$/, '') + '/ping', {signal: ctl.signal, cache: 'no-store'});
    return r.ok && (await r.json()).ok === true;
  } catch (e) { return false; }
}
async function pingLive() {   // reachable only from the owner's PC
  for (const base of [LOCAL_APP]) {
    if (await ping(base)) { LIVE_BASE = base; LIVE_ON = true; break; }
  }
  if (ME && LIVE_ON) route();
}
function goLive(path) {   // signs in on the live app with the same key (POST, never in the URL)
  const f = document.createElement('form');
  f.method = 'post'; f.action = LIVE_BASE.replace(/\/$/, '') + '/login'; f.target = '_blank';
  for (const [n, v] of [['key', KEY], ['agree', '1'], ['next', path]]) {
    const i = document.createElement('input'); i.type = 'hidden'; i.name = n; i.value = v; f.appendChild(i);
  }
  document.body.appendChild(f); f.submit(); f.remove();
}
function liveBtn(label, path, small) {
  const cls = small ? 'chip' : 'btn ' + (LIVE_ON ? 'primary' : 'ghost');
  return LIVE_ON ? `<button class="${cls}" style="cursor:pointer" onclick="goLive('${path}')">${esc(label)}</button>`
    : `<button class="${cls}" disabled style="opacity:.55" title="only on the owner's PC">${esc(label)}</button>`;
}
function liveBar(what) {
  return `<div class="livebar"><span class="dot ${LIVE_ON ? 'on' : ''}"></span><span>
    ${LIVE_ON ? 'Server on this PC — ' + esc(what) + ' opens the live app.'
              : esc(what[0].toUpperCase() + what.slice(1)) + ' is done on the owner’s PC — send your key or request to the owner. Everything below is readable anytime.'}</span></div>`;
}

// ---------- shell ----------
function shell(active, body) {
  const role = ME.role;
  const tab = (id, label) => `<a href="#${id}" class="${active === id ? 'active' : ''}">${label}</a>`;
  const tabs = tab('analytics', 'Analytics') + (role !== 'ran' ? tab('ads', 'Ads') : '')
    + (ME.launch ? tab('launch', 'Launches') : '') + (role === 'admin' ? tab('admin', 'Admin') : '');
  $app.innerHTML = `<header><div class="bar">${BRAND}<div class="tabs">${tabs}</div>
    <span class="who">${esc(ME.name)} · <a onclick="logout()">log out</a></span></div></header>${body}`;
}

function route() {
  if (!ME) return;
  const h = location.hash.slice(1);
  const [page, ...rest] = h.split('/');
  if ((page === 'ads' || page === 'game') && ME.ads) return page === 'ads' ? adsView(decodeURIComponent(rest[0] || '')) : gameView(rest[0], rest[1]);
  if (page === 'admin' && ME.admin) return adminView();
  if (page === 'launch' && ME.launch) return launchView();
  analyticsView(page === 'analytics' ? rest[0] : '');
}

// ---------- shared bits: icons, links, numbers, sparklines, line charts ----------
const fk = v => (v === null || v === undefined || isNaN(+v)) ? '—' : (v = +v, Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'M'
  : Math.abs(v) >= 1e4 ? Math.round(v / 1e3) + 'k' : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v)));
const fp = v => (v === null || v === undefined) ? '—' : Math.round(v * 100) + '%';

const CH = {}; let CHN = 0;
function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= m) return k * p; return 10 * p; }

  const id = 'ch' + (++CHN), W = 640, H = 210, L = 46, R = 92, T = 16, B = 26, n = Math.max(2, o.n);
  const vals = o.series.flatMap(s => (s.vals || []).slice(0, n)).filter(v => v != null);

  const X = i => L + i * (W - L - R) / (n - 1), Y = v => T + (H - T - B) * (1 - v / max);

    + `<text x="${L - 6}" y="${Y(max * t) + 4}" text-anchor="end" class="ax">${fmt(max * t)}</text>`;

  for (const l of labels) g += `<text x="${l.x + 6}" y="${l.y + 4}" class="dl">${esc(l.name)}</text>`;
  g += `<line id="${id}-x" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink)" opacity="0"/>`;
  g += `<rect x="${L - 4}" y="${T}" width="${W - L - R + 8}" height="${H - T - B}" fill="transparent" style="cursor:crosshair"
    onmousemove="chHover(event,'${id}')" onmouseleave="chOut('${id}')" ontouchmove="chHover(event,'${id}')" ontouchstart="chHover(event,'${id}')"/>`;

function scopeOptions() {   // admin: my keys / all keys / each key; a user: only their own keys
  const S = ME.ads.studios, mine = S.filter(s => s.mine), opts = [];
  if (ME.role === 'admin') {
    if (mine.length) opts.push(['mine', `My keys (${mine.length})`]);
    opts.push(['all', `All keys (${S.length})`]);
  } else if (S.length > 1) opts.push(['all', `All my keys (${S.length})`]);
  for (const s of S) opts.push(['k:' + s.cid, `${s.account}${ME.role === 'admin' && !s.mine && s.login ? ' · ' + s.login : ''}${s.mine && ME.role === 'admin' ? ' · mine' : ''} (${s.games.length} games)`]);
  return opts;
}
function adsScope() {
  const opts = scopeOptions(), v = store.get('ranalytics.adsKey');

}
function setScope(v) { store.set('ranalytics.adsKey', v); route(); }
function allRows() {   // one row per game, even when two keys see the same game
  const sc = adsScope(), rows = [], seen = new Set();
  const pick = s => sc === 'all' || (sc === 'mine' && s.mine) || sc === 'k:' + s.cid;
  for (const s of ME.ads.studios) if (pick(s)) for (const g of s.games) {
    if (seen.has(String(g.universe))) continue;

  return rows;
}

function ncell(v, good, mid, kind) {
  if (v === null || v === undefined || v === '') return `<td style="text-align:right;color:var(--mut)">—</td>`;
  v = +v;
  const t = kind === 'pct' ? Math.round(v * 100) + '%' : kind === 'min' ? v.toFixed(1) : num(v);
  const c = good === null ? 'var(--ink)' : v >= good ? 'var(--ok)' : v >= mid ? 'var(--warn)' : 'var(--bad)';
  return `<td style="text-align:right;color:${c}">${t}</td>`;
}
function adsGuide(G) {
  if (!G) return '';
  const plan = G.plan.map(t => `<li style="margin:6px 0">${esc(t)}</li>`).join('');
  const facts = G.facts.map(([h, t]) => `<div style="margin:8px 0"><b>${esc(h)}.</b> <span style="color:var(--mut)">${esc(t)}</span></div>`).join('');
  return `<details class="vcard" style="border-left-color:var(--accent);margin:0 0 14px" ${store.get('ranalytics.guide') === 'closed' ? '' : 'open'}
      ontoggle="store.set('ranalytics.guide', this.open ? 'open' : 'closed')">
    <summary style="cursor:pointer;font-weight:600">How to run ads — guide <span class="stud mono" style="font-weight:400;font-size:12px">as of ${esc(G.as_of)} · from the data below</span></summary>
    <div class="lab" style="margin-top:12px">Launch plan (since the 16+ gate)</div><ol style="margin:6px 0 0;padding-left:20px">${plan}</ol>
    <div class="lab" style="margin-top:14px">Ads Manager — how it works</div>${facts}
    <p class="hint" style="margin:10px 0 0">${esc(G.unknown)}</p></details>`;
}
const LVL = {stop: ['■', 'Stop ads', 0], off: ['◆', 'Turn ads off', 1], success: ['▲', 'Success', 2], go: ['▲', 'Success', 2],
  watch: ['●', 'Watching', 3], info: ['○', 'Info', 4]};
const URGENT = new Set(['stop', 'off', 'success', 'go']);
const TRACK = {hit: 'on the median hit’s track', between: 'between the median hit and fail', fail: 'on the median fail’s track'};
function lvlBadge(l) { const v = LVL[l] || LVL.info; return `<span class="lvl ${l}">${v[0]} ${v[1]}</span>`; }
function todayCard(rows) {
  const all = rows.filter(r => r.active && r.action)
    .sort((a, b) => ((LVL[a.action[0]] || LVL.info)[2] - (LVL[b.action[0]] || LVL.info)[2]) || ((b.dau_last || 0) - (a.dau_last || 0)));
  if (!all.length) return `<div class="vcard" style="border-left-color:var(--accent)"><div class="lab">What to do today</div>
    <p class="stud">No live launches: nothing launched in the last 45 days or running ads.</p></div>`;
  const act = all.filter(r => URGENT.has(r.action[0])), rest = all.filter(r => !URGENT.has(r.action[0]));
  const item = r => `<div class="trow" onclick="location.hash='game/${esc(r._cid)}/${esc(r.universe)}'">${gicon(r, 38)}
    <div style="min-width:0"><div class="tname">${esc(r.name)}</div><div class="ttext">${esc(r.action[1])}</div>
    ${r.action[2] ? `<div class="stud" style="font-size:12px;margin-top:3px">Home impressions: ${TRACK[r.action[2]]}</div>` : ''}</div>
    <div style="text-align:right;white-space:nowrap">${lvlBadge(r.action[0])}<div class="stud mono" style="font-size:11.5px;margin-top:5px">day ${r.day ?? '—'}</div></div></div>`;
  const open = store.get('ranalytics.watching') === 'open';
  return `<div class="vcard" style="border-left-color:var(--accent)"><div class="lab">What to do today — ${act.length ? act.length + ' need a decision' : 'nothing urgent'}</div>
    <div class="today">${act.map(item).join('') || '<p class="stud" style="margin:8px 0 0">No game needs a decision today.</p>'}</div>
    ${rest.length ? `<details class="watching" ${open ? 'open' : ''} ontoggle="store.set('ranalytics.watching', this.open ? 'open' : 'closed')">
      <summary>Watching (${rest.length}) — tests in progress, nothing to decide yet</summary><div class="today">${rest.map(item).join('')}</div></details>` : ''}</div>`;
}
function adsMode() { const v = store.get('ranalytics.adsMode'); return v === 'archive' || v === 'all' ? v : 'active'; }
function setMode(v) { store.set('ranalytics.adsMode', v); location.hash = 'ads'; route(); }
function adsView(filt) {
  const A = ME.ads, all = allRows(), keys = A.keys.filter(k => k.status !== 'deleted');
  const label = keys.length ? `${keys.length} key${keys.length === 1 ? '' : 's'} connected` : 'no key yet';
  const chipsKeys = keys.length ? `<div class="chips"><span class="stud" style="align-self:center">your keys:</span>

  const head = `<div class="ptop"><h2>Ads — my games</h2><span class="stud mono" style="font-size:12.5px">${label}</span></div>`
    + liveBar('adding or deleting a key') + `<div class="actions" style="margin:0 0 14px">${liveBtn('Add a key', '/connect')} ${manage}</div>`

    .map(([k, l]) => `<a class="chip ${mode === k ? 'on' : ''}" onclick="setMode('${k}')">${l}</a>`).join(' ');
  const counts = {};
  rows.forEach(r => counts[r.outcome] = (counts[r.outcome] || 0) + 1);
  const kpi = [['взлёт', 'taking off'], ['растёт сейчас', 'rising'], ['провал', 'failed'], ['рано', 'too early']]
    .map(([k, l]) => `<div class="kpi"><b style="color:${C.OUT_COLOR[k]}">${counts[k] || 0}</b><span>${l}</span></div>`).join('');
  const chips = [['', `all (${rows.length})`]].concat(['взлёт', 'растёт сейчас', 'провал', 'рано']
    .filter(k => counts[k]).map(k => [k, `${C.OUT_EN[k]} (${counts[k]})`]))
    .map(([k, l]) => `<a href="#ads/${encodeURIComponent(k)}" class="chip ${filt === k ? 'on' : ''}">${esc(l)}</a>`).join(' ');

  const body = show.slice(0, 400).map(r => {

      + `<td style="color:${c};font-weight:600">${esc(C.OUT_EN[r.outcome] || r.outcome || '')}${r.active && r.action ? '<br>' + lvlBadge(r.action[0]) : ''}</td>`
      + `<td class="stud" style="text-align:left">${r.day != null ? 'day ' + r.day : '—'}</td>`

      + ncell(r.peak_dau, null, null, 'n') + ncell(r.revenue_total, null, null, 'n')
      + ncell(r.s1_entry, .60, .55, 'pct') + ncell(r.s1_nufsr5, .43, .35, 'pct')

    <th title="click → play on the 16+ test">entry</th><th title="still playing at 5 min, 16+ test">5 min</th><th title="minutes per new player, 16+ test">min</th><th title="day-1 return of Home players after opening to kids">D1 Home</th></tr></thead><tbody>${show.length ? body : '<tr><td class="stud" colspan="11">Nothing here.</td></tr>'}</tbody></table></div>
    <p class="hint">Live launch = launched in the last 45 days or ads in the last 7 days. Cell color = take-off threshold: entry ≥60%, 5 min ≥43%, min ≥8, D1 Home ≥11% (amber 8–11%). Click a game for its launch curves; click its name to open it on Roblox.</p>${foot()}</div>`);
}

function gameView(cid, uni) {
  const s = ME.ads.studios.find(x => x.cid === cid);
  const g = s && s.games.find(x => String(x.universe) === String(uni));
  if (!g) { location.hash = 'ads'; return; }
  const d = g.detail, S = g.series, Bm = ME.ads.bench;
  let charts = '';
  if (S) {
    const n = Math.max(Bm ? 21 : 2, Math.min((S.home || []).length, 60));
    const ser = key => [{name: 'this game', short: 'this game', color: SER.game, vals: S[key]}].concat(Bm ? [
      {name: `median hit (${Bm.games.win} launches)`, short: 'median hit', color: SER.hit, dash: '7 4', vals: Bm['win_' + key]},
      {name: `median fail (${Bm.games.fail} launches)`, short: 'median fail', color: SER.fail, dash: '2 4', vals: Bm['fail_' + key]}] : []);
    const mk = [{x: S.unlock, label: 'open to kids'}];
    const note = 'Day 0 = first day with 20+ players or ads. Medians: launches since the 16+ gate (anonymised studio studies).';
    charts = `<div class="cards2" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">
      ${lineChart({title: 'Home impressions a day — the take-off signal', n, series: ser('home'), markers: mk, note})}
      ${lineChart({title: 'Ad impressions a day', n, series: ser('ad'), markers: mk})}
      ${lineChart({title: 'Daily active users', n, series: ser('dau'), markers: mk})}
      ${lineChart({title: 'New players still playing at 5 min', n, series: ser('n5'), markers: mk, fmt: fp})}</div>`;
  }
  let body;
  if (!d) {
    body = `<div class="hint" style="margin-top:6px">No full breakdown for this game yet (too little data, or it was collected before breakdowns existed). It fills in on the next collection.</div>`;
  } else {
    const vb = {1: 'var(--warn)', 2: 'var(--accent)', 3: 'var(--ok)', 0: 'var(--bad)'}[d.stage] || 'var(--mut)';
    const fun = d.funnel.map(([lab, val, gr]) => {
      const col = gr === null ? 'var(--mut)' : gr >= .67 ? 'var(--ok)' : gr >= .34 ? 'var(--warn)' : 'var(--bad)';
      const w = gr === null ? 2 : Math.max(4, Math.round(gr * 100));
      return `<div class="frow"><span>${esc(lab)}</span><div class="track"><div class="fill" style="width:${w}%;background:${col}"></div></div><span class="val">${esc(val)}</span></div>`;
    }).join('');
    body = `<div class="vcard" style="border-left-color:${vb}"><div class="lab">Verdict · ${esc(d.phase)}</div><div class="big">${esc(d.verdict)}</div></div>
      <div class="vcard" style="border-left-color:${d.ign ? 'var(--ok)' : 'var(--accent)'}"><div class="lab">Advertising</div><p>${esc(d.ads)}</p></div>
      ${d.advice ? `<div class="vcard" style="border-left-color:var(--warn)"><div class="lab">What to fix first</div><p>${esc(d.advice)}</p></div>` : ''}
      <div class="vcard"><div class="lab">Funnel (last 180 days)</div><div class="funnel">${fun}</div></div>`;
  }
  const act = g.active && g.action ? `<div class="vcard" style="border-left-color:${{go: 'var(--ok)', success: 'var(--ok)', off: 'var(--ok)', watch: 'var(--warn)', stop: 'var(--bad)'}[g.action[0]] || 'var(--mut)'}">
    <div class="lab">Today · day ${g.day ?? '—'} ${lvlBadge(g.action[0])}</div><p style="font-size:15px">${esc(g.action[1])}</p>
    ${g.action[2] ? `<p class="stud" style="font-size:13px">Home impressions are ${TRACK[g.action[2]]}.</p>` : ''}</div>` : '';
  const url = rlink(g);
  shell('ads', `<div class="page"><a href="#ads" class="back">← back</a>
    <div class="ptop" style="margin-top:8px"><div class="gcell">${gicon(g, 56)}<div><h2>${esc(g.name)}</h2>
    <div class="stud" style="font-size:12.5px">${esc(s.account)} · universe ${esc(g.universe)} · updated ${esc(s.updated)}${url ? ` · <a href="${url}" target="_blank" rel="noopener">open on Roblox ↗</a>` : ''}</div></div></div></div>
    ${act}${charts}${body}${foot()}</div>`);

}

}

    ${liveBar('creating logins, disabling them, copying and disconnecting keys')}
    <div class="actions" style="margin:0 0 14px">${liveBtn('Create login', '/admin')} ${liveBtn('Open admin panel', '/admin')}</div>
    <div class="tbl-wrap"><table style="min-width:560px"><thead><tr><th>login</th><th>role</th><th>status</th><th style="text-align:left">connected keys</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="hint">A disabled login stops opening this site on the next publish (every few hours, or right after a collection).</p>${foot()}</div>`);
}

function foot() { return `<footer class="site">Updated ${esc(V.generated)}</footer>`; }

(async () => {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    $app.innerHTML = '<div class="boot">This browser is too old for this page — open it in a current Chrome, Edge, Firefox or Safari.</div>';
    return;
  }
  const k = store.get('ranalytics.k');
  const me = k && await unlock(k);
  if (me) enter(k, me); else { store.del('ranalytics.k'); loginView(); }
})();
