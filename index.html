<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAnalytics</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"><style>
:root{color-scheme:dark;--bg:#0b0e13;--surface:#141a22;--surface-2:#10151c;--line:#232c38;
--ink:#e9eff6;--mut:#8b97a6;--accent:#37c2ff;--accent-ink:#04121c;--ok:#46c266;--warn:#e3b341;--bad:#f0603a;
--disp:'Sora',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--accent);text-decoration:none;cursor:pointer}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,14,19,.85);
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--ink)}
.spark{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs a{font-size:14px;font-weight:500;color:var(--mut);border-radius:7px;padding:7px 16px}
.tabs a.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.who{font-size:13px;color:var(--mut)}
.btn{display:inline-block;font-family:var(--body);font-weight:600;font-size:14px;padding:10px 18px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);padding:8px 15px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,color .15s,background .15s}.back:hover{border-color:var(--accent);color:var(--accent);background:rgba(55,194,255,.08)}.back .ar{font-size:17px;line-height:1}
.center{min-height:calc(100% - 58px);display:grid;place-items:start center;padding:40px 20px}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px}
.card.wide{max-width:620px}
.card h2{font-size:21px;font-weight:600;margin-bottom:4px}.card .sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.field{margin-top:14px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);font-family:var(--mono);font-size:13.5px}
.inp:focus{outline:none;border-color:var(--accent)}
.agree{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;color:var(--mut);margin-top:16px;white-space:pre-line;max-height:150px;overflow:auto}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:14px}.consent input{margin-top:3px;accent-color:var(--accent)}
.hint{color:var(--mut);font-size:12.5px;margin-top:12px}.err{color:var(--bad);font-size:13px;margin-top:10px}
.actions{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.guide{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:13px 15px;background:var(--surface-2);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide ol{margin:0;padding:14px 16px 14px 34px;display:grid;gap:9px;font-size:13.5px}
.guide code{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--accent)}
.guide .warn{color:var(--warn);font-size:12.5px;padding:0 16px 14px;margin:0}
.page{max-width:1080px;margin:0 auto;padding:24px 20px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ptop h2{font-size:20px;font-weight:700}
.sec{margin-bottom:26px}.sec h3{font-size:15px;font-weight:600;margin-bottom:4px}.sec .cap{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.r{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:11px 15px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}.r .nm{font-size:14px}.r .nm small{color:var(--mut);display:block;font-size:12px;margin-top:1px}
.r .ccu{font-family:var(--mono);font-size:13px;text-align:right}.r .gr{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ok);text-align:right;min-width:52px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tcard .t{font-family:var(--mono);font-size:14px}.tcard .g{font-family:var(--mono);color:var(--ok);font-weight:600;font-size:13px}
.tcard small{color:var(--mut);font-size:12px;display:block;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{font-family:var(--disp);font-size:30px;font-weight:700;display:block;line-height:1}.kpi span{font-size:12.5px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.chip{font-size:13px;padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th,td{padding:11px 12px;text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:500;border-bottom:1px solid var(--line);font-size:12.5px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
tbody tr{border-top:1px solid var(--line)}tbody tr:hover{background:var(--surface)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn,.chip,.tabs a,select.inp{transition:background .15s,border-color .15s,color .15s,box-shadow .15s,filter .15s}
.btn.primary:not([disabled]):hover{filter:brightness(1.12);box-shadow:0 0 0 3px rgba(55,194,255,.25)}
.btn.ghost:not([disabled]):hover{border-color:var(--accent);color:var(--accent)}
a.chip:hover,button.chip:not([disabled]):hover{border-color:var(--accent);color:var(--accent);background:rgba(55,194,255,.1)}
a.chip.on:hover{color:var(--accent-ink);background:var(--accent)}
.chip.danger:not([disabled]):hover{border-color:var(--bad);color:var(--bad);background:rgba(240,96,58,.1)}
.tabs a:not(.active):hover{color:var(--ink);background:var(--surface)}
select.inp:hover{border-color:var(--accent)}
.consent a{text-decoration:underline;text-underline-offset:3px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:80vh;
display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600}
.modal .txt{padding:16px 18px;overflow:auto;white-space:pre-line;font-size:13.5px;color:var(--mut)}
td.name a{color:var(--ink)}td.name a:hover{color:var(--accent)}
.stud{color:var(--mut)}.badge{font-weight:600;font-size:12.5px}
.vcard{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--surface)}
.vcard .lab{font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.vcard .big{font-family:var(--disp);font-weight:600;font-size:18px;margin-top:4px}.vcard p{margin:6px 0 0}
.funnel{display:grid;gap:9px;margin-top:12px}
.frow{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:12px;font-size:13.5px}
.track{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:6px}.frow .val{font-family:var(--mono);text-align:right;color:var(--mut)}
@media(max-width:560px){.frow{grid-template-columns:110px 1fr 50px}}
body:has(.dash){display:flex;flex-direction:column;height:100vh;overflow:hidden}
.dash{flex:1;display:block;width:100%;border:0;background:var(--bg)}

.tkpi b{display:block;font-family:var(--display,inherit);font-size:30px;line-height:1.1;color:var(--kc)}.tkpi span{font-size:13px;color:var(--mut)}
.thero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:8px;align-items:start}@media(max-width:900px){.thero{grid-template-columns:1fr}}

.turgent{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--bad) 10%,var(--surface)),var(--surface) 55%)}

.bcol{min-height:160px;flex:none;transition:outline-color .15s,box-shadow .15s}.bcol .tcard{margin-bottom:8px}.bcard{cursor:grab}.bcard:active{cursor:grabbing}

.tdragging.td-c .bcard,.tdragging.td-g .bcard{outline:none}.tdragging.td-p .bcard,.tdragging.td-a .bcard,.tdragging.td-p .lcard{outline:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.bcol.over{outline:2px solid var(--accent)!important;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 15%,transparent)}

.tc-draft{display:inline-grid;place-items:center;background:color-mix(in srgb,#b48cff 18%,var(--surface-2));color:#b48cff;border-radius:8px;width:30px;height:30px;font-size:14px;flex:none}
.tc-link{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tc-link b{color:var(--ink)}
.lcard{cursor:grab}.chip.tdanger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.prow{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer}
.prow:hover{border-color:var(--accent)}.rolechip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:13px}.ptag{cursor:pointer}.pcard{cursor:pointer}

.tcard.working{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}.tc-eye{position:absolute;top:8px;right:8px;width:26px;height:26px;opacity:.55}.tcard:hover .tc-eye{opacity:1}
.tcard.pickme,.ucard.pickme{outline:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}

<script>
let V = JSON.parse(document.getElementById('vault').textContent);
const C = {"OUT_EN": {"взлёт": "taking off", "растёт сейчас": "rising", "средне": "ok", "провал": "failed", "рано": "too early", "нет игроков": "no players", "сбой — перезапусти": "retry"}, "OUT_COLOR": {"взлёт": "var(--ok)", "растёт сейчас": "var(--ok)", "средне": "var(--accent)", "провал": "var(--bad)", "рано": "var(--mut)", "нет игроков": "var(--mut)", "сбой — перезапусти": "var(--bad)"}, "RANK": {"взлёт": 0, "растёт сейчас": 1, "средне": 2, "рано": 3, "провал": 4, "нет игроков": 5, "сбой — перезапусти": 6}, "DEVEX": 0.0038};
const BRAND = `<div class="brand"><svg class="spark" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-9" stroke="#37c2ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="5" r="2.4" fill="#46c266"/></svg>RAnalytics</div>`;
const AGREEMENT = `RAnalytics shows you Roblox market data (the Analytics tab) and a launch/advertising breakdown of your own games (the Ads tab).

For the Ads tab you connect your Roblox API key with analytics read access. The service only reads — it never changes anything in your games. By connecting the key you allow the owner to store it (encrypted) and to see your games&#x27; analytics. You can revoke access at any time, here or in the Roblox Creator Hub.

The Analytics tab needs no key. The service never changes anything in your games.`;
const $app = document.getElementById('app');
const enc = new TextEncoder();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? '—'
  : Math.trunc(+v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
document.addEventListener('keydown', e => { const m = document.getElementById('agm'); if (e.key === 'Escape' && m) m.classList.remove('open'); });
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ---------- crypto: AES-256-GCM boxes, key per login via PBKDF2 ----------
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function gunzip(buf) {
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
async function openBox(key, box) {
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(box.iv)}, key, unb64(box.ct));
  return gunzip(pt);
}
async function slotId(k) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('ranalytics:' + k)));
  return [...h].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
}
async function freshVault() {   // the browser / GitHub may still hold an older page (new login just added)
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/<script id="vault" type="application\/json">([\s\S]*?)<\/script>/);
    if (m) { V = JSON.parse(m[1]); return true; }
  } catch (e) {}
  return false;
}
async function unlock(k) {
  let s = V.slots[await slotId(k)];
  if (!s && await freshVault()) s = V.slots[await slotId(k)];
  if (!s) return null;
  const base = await crypto.subtle.importKey('raw', enc.encode(k), 'PBKDF2', false, ['deriveKey']);
  const ku = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: unb64(s.salt), iterations: V.iter, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  try { return JSON.parse(await openBox(ku, s)); } catch (e) { return null; }
}

// ---------- state ----------
let ME = null, KEY = null, DASH_URL = null, LIVE_ON = false, LIVE_BASE = null;
const LOCAL_APP = 'http://127.0.0.1:8750';   // the live app runs only on the owner's PC (no tunnel)

function loginView(err) {
  $app.innerHTML = `<div class="center"><div class="card">${BRAND}
    <h2 style="margin-top:14px">Sign in</h2><div class="sub">Enter your access key and accept the agreement.</div>
    <form id="lf"><div class="field"><label>Access key</label>
    <input class="inp" id="k" type="password" autocomplete="current-password" placeholder="the key you were given"></div>
    <label class="consent"><input type="checkbox" id="ag"> <span>I accept the
      <a href="#" onclick="event.preventDefault();document.getElementById('agm').classList.add('open')">user agreement</a></span></label>
    <div class="actions"><button class="btn primary" id="lb">Sign in</button></div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <p class="hint">No access key? Ask the owner. Access can be revoked at any time.</p></form></div></div>
    <div class="modal" id="agm" onclick="if(event.target===this)this.classList.remove('open')"><div class="box">
      <div class="head">User agreement<button type="button" class="chip" style="cursor:pointer"
        onclick="document.getElementById('agm').classList.remove('open')">Close</button></div>
      <div class="txt">${AGREEMENT}</div></div></div>`;
  document.getElementById('k').focus();
  document.getElementById('lf').onsubmit = async e => {
    e.preventDefault();
    const k = document.getElementById('k').value.trim();
    if (!document.getElementById('ag').checked) return loginView('Please accept the user agreement.');
    const b = document.getElementById('lb'); b.disabled = true; b.textContent = 'Checking…';
    const me = k && await unlock(k);
    if (!me) return loginView('Invalid or disabled access key. A login created just now starts working about 1–2 minutes later — try again then.');
    store.set('ranalytics.k', k); enter(k, me);
  };
}

async function enter(k, me) {
  KEY = k; ME = me;
  if (V.analytics) {
    try {

const CAR = {};
function perPage() { const w = window.innerWidth; return w < 760 ? 1 : w < 1180 ? 2 : 3; }

  return `<div class="car" id="${id}">${carInner(id)}</div>`;
}
function carInner(id) {
  const c = CAR[id], pp = perPage(), pages = Math.max(1, Math.ceil(c.items.length / pp));
  c.page = Math.min(c.page, pages - 1);
  if (!c.items.length) return '<p class="stud">Nothing growing right now.</p>';
  const cards = c.items.slice(c.page * pp, c.page * pp + pp).map(c.fn).join('');
  const dots = Array.from({length: pages}, (_, i) => `<a class="dot2 ${i === c.page ? 'on' : ''}" onclick="carGo('${id}',${i})" title="page ${i + 1}"></a>`).join('');
  return `<div class="carrow"><button class="carb" onclick="carGo('${id}',${c.page - 1})" ${c.page ? '' : 'disabled'} aria-label="previous">‹</button>
    <div class="cartrack" style="grid-template-columns:repeat(${pp},minmax(0,1fr))">${cards}</div>
    <button class="carb" onclick="carGo('${id}',${c.page + 1})" ${c.page < pages - 1 ? '' : 'disabled'} aria-label="next">›</button></div>
    ${pages > 1 ? `<div class="dots">${dots}</div>` : ''}`;
}
function carGo(id, p) {
  const c = CAR[id], el = document.getElementById(id); if (!c || !el) return;
  c.page = Math.max(0, p); el.innerHTML = carInner(id);
}
window.addEventListener('resize', () => { for (const id in CAR) { const el = document.getElementById(id); if (el) el.innerHTML = carInner(id); } });

          title="${isHid ? 'Hidden — click to show it again' : 'Visible — click to hide it from Ads (this browser)'}" aria-label="${isHid ? 'unhide' : 'hide'}">${isHid ? EYE.shut : EYE.open}</button></td></tr>`;
  }).join('');
  return `<div class="chips" style="margin:18px 0 8px">${modes}</div><div class="chips" style="margin:0 0 14px">${chips}</div>
    <div class="adsData"><div class="kpis" style="margin-bottom:14px">${kpi}</div>
    <div class="tbl-wrap eyes"><table class="tight"><thead><tr>${ths}<th class="eyec"></th></tr></thead><tbody>${show.length ? body : `<tr><td class="stud" colspan="13">${isHid ? 'No hidden games. Click the eye next to a game to tuck it away.' : 'Nothing here.'}</td></tr>`}</tbody></table></div>
    <p class="hint">Click a column header to sort (again — reverse); empty cells always go last. “updated” = the game’s last publish on Roblox. The eye next to a row hides the game from every list and “What to do today” (remembered in this browser). Live launch = ads running now (a «Stop ads» game still has them on) or a success (take-off, ignition); everything else is in Archive. Numbers = the latest 3 days with data, before and after opening to kids alike (revenue: their sum); the 16+ test value is in the cell tooltip. Cell color = take-off threshold: entry ≥60%, 5 min ≥43%, min ≥8, D1 ≥7% (amber 4–7%, red under 4%: no launch since the 16+ gate took off from there). Arrows = where the metric is heading now: its latest 3 days vs the same weekdays a week earlier, or the 3 days before for a game younger than ~10 days (↑ / ↓ beyond 1 pt or 5%, → flat; hover for the numbers). Roblox delivers these 1–2 days late, D1 and revenue a day more. A growing audience often pulls rates down by itself. Click a game for its launch curves; click its name to open it on Roblox.</p></div>`;
}
function adsView(filt) {
  if (filt) ADS_FILT = filt;
  const A = ME.ads, all = allRows(), keys = A.keys.filter(k => k.status !== 'deleted');
  const label = keys.length ? `${keys.length} key${keys.length === 1 ? '' : 's'} connected` : 'no key yet';
  const chipsKeys = keys.length ? `<div class="chips"><span class="stud" style="align-self:center">your keys:</span>
    ${keys.map(k => `<span class="chip">${esc(k.label)}</span>`).join(' ')}</div>` : '';
  const manage = !keys.length ? '' : LIVE_ON
    ? `<button class="btn ghost" onclick="goLive('/ads#manage')">Manage keys</button>`
    : `<button class="btn ghost" disabled title="only on the owner's PC">Manage keys</button>`;
  const head = `<div class="ptop"><h2>Ads — my games</h2><span class="stud mono" style="font-size:12.5px">${label}</span></div>`
    + liveBar('adding or deleting a key') + `<div class="actions" style="margin:0 0 14px">${liveBtn('Add a key', '/connect')} ${manage}</div>`
    + chipsKeys + scopeSelect();
  if (!all.length) {
    const note = keys.length ? 'Your games are being collected — they appear here after the next publish (usually within minutes).'
      : 'Connect your Roblox key to see your games here. You can add as many keys as you like.';
    return shell('ads', `<div class="page">${head}<div class="hint" style="margin-top:14px">${note}</div>${foot()}</div>`);
  }
  shell('ads', `<div class="page wide">${head}<div id="adsToday">${todayCard(adsSplit().vis)}</div><div id="adsBody">${adsBody()}</div>${foot()}</div>`);
}

function gameView(cid, uni) {
  const s = ME.ads.studios.find(x => x.cid === cid);
  const g = s && s.games.find(x => String(x.universe) === String(uni));
  if (!g) { location.hash = 'ads'; return; }
  const d = g.detail, S = g.series, Bm = ME.ads.bench;
  let charts = S ? `<div class="vcard gcard"><div id="gchart"></div></div>` : '';
  GV = {g, cid, metric: GV && GV.g === g ? GV.metric : 'home', show: {game: true, hit: true, fail: true}, cmp: [], range: 0};
  let body;
  if (!d) {
    body = `<div class="hint" style="margin-top:6px">No full breakdown for this game yet (too little data, or it was collected before breakdowns existed). It fills in on the next collection.</div>`;
  } else {
    const vb = {1: 'var(--warn)', 2: 'var(--accent)', 3: 'var(--ok)', 0: 'var(--bad)'}[d.stage] || 'var(--mut)';
    const fun = d.funnel.map(([lab, val, gr]) => {
      const col = gr === null ? 'var(--mut)' : gr >= .67 ? 'var(--ok)' : gr >= .34 ? 'var(--warn)' : 'var(--bad)';
      const w = gr === null ? 2 : Math.max(4, Math.round(gr * 100));
      return `<div class="frow"><span>${esc(lab)}</span><div class="track"><div class="fill" style="width:${w}%;background:${col}"></div></div><span class="val">${esc(val)}</span></div>`;
    }).join('');
    body = `<div class="vcard" style="border-left-color:${vb}"><div class="lab">Verdict · ${esc(d.phase)}</div><div class="big">${esc(d.verdict)}</div></div>
      <div class="vcard" style="border-left-color:${d.ign ? 'var(--ok)' : 'var(--accent)'}"><div class="lab">Advertising</div><p>${esc(d.ads)}</p></div>
      ${d.advice ? `<div class="vcard" style="border-left-color:var(--warn)"><div class="lab">What to fix first</div><p>${esc(d.advice)}</p></div>` : ''}
      <div class="vcard"><div class="lab">Funnel (last 180 days)</div><div class="funnel">${fun}</div></div>`;
  }
  const act = g.active && g.action ? `<div class="vcard" style="border-left-color:${{go: 'var(--ok)', success: 'var(--ok)', off: 'var(--ok)', fix: 'var(--accent)', late: '#ff8a3d', watch: 'var(--warn)', stop: 'var(--bad)'}[g.action[0]] || 'var(--mut)'}">
    <div class="lab">Today · day ${sinceLaunch(g) ?? g.day ?? '—'} since launch${g.start ? ' · data up to ' + dayDate(g.start, g.day) : ''} ${lvlBadge(g.action[0], tkLab(g))}</div><p style="font-size:15px">${esc(g.action[1])}</p>
    ${g.action[2] ? `<p class="stud" style="font-size:13px">Home impressions are ${TRACK[g.action[2]]}.</p>` : ''}
    ${g.odds ? `<p class="stud" style="font-size:13px">${esc(g.odds.text)}</p>` : ''}</div>` : '';
  const U = (g.upd || []);
  const dlt = (pair, f, pctPts) => {
    if (!pair || pair[0] == null || pair[1] == null) return '<td class="stud">—</td>';
    const [b0, a0] = pair, up = a0 >= b0, rel = pctPts ? (a0 - b0) * 100 : b0 ? (a0 - b0) / b0 * 100 : null;
    const col = rel == null || Math.abs(rel) < (pctPts ? 1 : 5) ? 'var(--ink)' : up ? 'var(--ok)' : 'var(--bad)';
    const chg = rel == null ? '' : ` <span style="color:${col};font-size:11.5px">${up ? '+' : ''}${rel.toFixed(pctPts ? 1 : 0)}${pctPts ? ' pt' : '%'}</span>`;
    const wk = [pair[2], pair[3]].map((w, i) => {   // the same weekdays 1 / 2 weeks earlier
      if (w == null) return '';
      const r = pctPts ? (a0 - w) * 100 : w ? (a0 - w) / w * 100 : null;
      if (r == null) return '';
      const c = Math.abs(r) < (pctPts ? 1 : 5) ? 'var(--mut)' : r > 0 ? 'var(--ok)' : 'var(--bad)';
      return `<span style="color:${c}">${i + 1} wk ${r > 0 ? '+' : ''}${r.toFixed(pctPts ? 1 : 0)}${pctPts ? ' pt' : '%'}</span>`;
    }).filter(Boolean).join(' · ');
    return `<td class="mono" style="white-space:nowrap">${f(b0)} → ${f(a0)}${chg}${wk ? `<div style="font-size:11px">${wk}</div>` : ''}</td>`;
  };
  const updVerdict = e => {   // siteviews._updates: ccu (hourly, same hours of past weeks), pt_eff, verdict
    const pc = v => (v >= 1 ? '+' : '') + Math.round((v - 1) * 100) + '%';
    const bits = [];
    if (e.ccu != null) bits.push(`CCU ${pc(e.ccu)} vs same hours${e.ccu_raw != null ? ` <span class="stud">(raw ${pc(e.ccu_raw)})</span>` : ''}`
      + (e.ccu_rough ? ' <span class="stud" title="The game was more than 2× bigger or smaller a week earlier — the same-hours yardstick is rough">· rough</span>' : ''));
    else if (e.ccu_note === 'fresh') bits.push('<span class="stud">CCU: hours after not in yet</span>');
    if (e.pt_eff != null) bits.push(`playtime ${pc(e.pt_eff)}`);
    const v = e.verdict, badge = v === 'ok' ? '<b style="color:var(--ok)">✓ not a failure</b>' : v === 'bad' ? '<b style="color:var(--bad)">✗ hurt the game</b>' : '<span class="stud">—</span>';
    return `<td style="text-align:left;font-size:12.5px;white-space:nowrap">${badge}${bits.length ? '<div>' + bits.join('<br>') + '</div>' : ''}</td>`;
  };
  const updCard = !U.length ? '' : `<div class="vcard" style="border-left-color:${UPD_COLOR}"><div class="lab">Updates — what changed (${UPD_W} days before → ${UPD_W} days after)</div>
    <div class="tbl-wrap"><table style="min-width:760px"><thead><tr><th style="text-align:left">update</th><th style="text-align:left">verdict</th><th>still playing at 5 min</th><th>minutes per new player</th><th>D1</th><th>DAU</th><th>revenue R$/day</th></tr></thead><tbody>
    ${U.map(e => `<tr><td class="name" style="white-space:nowrap">day ${e.day} <span class="stud">${esc(e.date)}${e.n > 1 ? ' · ×' + e.n : ''}</span></td>`
      + updVerdict(e)
      + (e.fresh ? '<td class="stud" colspan="5">too fresh — the after-window isn’t in yet</td>'
        : e.launch ? '<td class="stud" colspan="5">launch-day update — no days before it to compare with</td>'
        : dlt(e.n5, fp, true) + dlt(e.pt, v => (+v).toFixed(1), false) + dlt(e.d1, fp, true) + dlt(e.dau, fk, false) + dlt(e.rev, fk, false)) + '</tr>').join('')}
    </tbody></table></div>
    <p class="hint" style="margin:8px 0 0"><b>Verdict</b> — an update is not a failure unless CCU or playtime drops more than 15%. CCU = the 6 hours after the publish against the same hours 1 and 2 weeks earlier, set against the same for the 6 hours before it — so the hour of the day, the weekday and the game’s own slide going in all cancel out (“raw” = plain after ÷ before, mostly the clock). Playtime = minutes per new player, the same way by day.<br>Averages of the ${UPD_W} days before and after the publish day. Under each cell: the “after” days against the <b>same weekdays 1 and 2 weeks earlier</b> — weekends run ~1.5× a weekday, so a before → after drop that only crosses from Sunday into Monday is not the update. A real update effect shows in both lines. A game past its peak falls anyway — read big jumps, not small ones.</p></div>`;
  const M = g.money, MB = s.money_bench || {};
  const monAdvice = m => m.dau < 100 ? 'Too few players to judge monetization yet.'
    : m.cvr != null && m.cvr < 0.01 ? `Only ${fp1(m.cvr)} of players pay. Add a cheap starter pack (5–15 R$ — a 1 R$ item pays you 0) and show it in the first minutes.`
    : m.arppu != null && m.arppu < 20 ? `Players are willing to pay (${fp1(m.cvr)}), but each payer spends only ~${m.arppu} R$ a day — add pricier things: a VIP or x2 pass at 99–399 R$, bundles.`
    : 'Monetization is in line — grow players and returns rather than prices.';
  const cmp = (v, b, f) => v == null || b == null ? '' : `<span class="stud" style="font-size:11.5px">your median ${f(b)}</span>`;
  const monCard = !(M && M.dau) ? '' : `<div class="vcard" style="border-left-color:var(--ok)"><div class="lab">Monetization · last ${M.days} day${M.days === 1 ? '' : 's'}</div>
    <div class="kpis" style="margin:8px 0 6px">
      <div class="kpi"><b>${fk(M.rev_day)}</b><span>R$ a day · ${fk(M.total)} in total</span></div>
      <div class="kpi"><b>${M.arpdau == null ? '—' : M.arpdau.toFixed(2)}</b><span>R$ per player a day ${cmp(M.arpdau, MB.arpdau, v => v.toFixed(2))}</span></div>
      <div class="kpi"><b>${fp1(M.cvr)}</b><span>players who paid ${cmp(M.cvr, MB.cvr, fp1)}</span></div>
      <div class="kpi"><b>${M.arppu == null ? '—' : M.arppu}</b><span>R$ per paying player a day</span></div></div>
    <p style="margin:8px 0 0">${esc(monAdvice(M))}</p>
    <p class="stud" style="font-size:12.5px;margin:6px 0 0">Median over your games with 500+ players (${MB.n || 0}). Payers come back about twice as often as non-payers — a first purchase is worth more than its price. Curves: «R$ per player» and «Paying players» on the chart above.</p></div>`;
  const AF = g.after, AFL = {   // after take-off checklist (siteviews._after_takeoff)
    home_d1: ['Home D1 — Home players back next day', fp, 'Give them a reason for tomorrow: a daily reward, an unfinished timer / egg / build.'],
    home_d7: ['Home D7 — still here a week later', fp1, 'Add a week-long goal: rebirths or a collection, a new zone or event in week 2.'],
    pt: ['Minutes per new player', v => (+v).toFixed(1), 'Longer first session: the next goal always on screen, a reward every 1–2 minutes.'],
    arpdau: ['R$ per player a day', v => (+v).toFixed(2), 'Monetize the wave now — it won’t last: x2 / VIP pass at 99–399 R$, a 5–15 R$ starter pack, bundles.']};
  const afterCard = !AF ? '' : `<div class="vcard" style="border-left-color:var(--ok)"><div class="lab">After take-off — make it last${AF.day != null ? ` · day ${AF.day} since take-off` : ''}${AF.dau_share != null ? ` · DAU now ${Math.round(AF.dau_share * 100)}% of its peak` : ''}</div>
    <p style="margin:6px 0 10px">A typical hit’s Home impressions peak about ${AF.peak_at} days after take-off; around day ${AF.life} its DAU is under a third of the peak.
    ${AF.day == null ? '' : AF.day <= 7 ? '<b>Week 1: monetization</b> — the most players you will ever have are here now.' : AF.day <= AF.peak_at ? '<b>Week 2: a content update for day-7 returns</b>, and start the next game.' : AF.day <= AF.life ? '<b>Past the usual peak:</b> keep earning, put the main effort into the next game.' : '<b>Longer than a typical hit already</b> — keep the content coming while it pays.'}</p>
    <div class="tbl-wrap"><table style="min-width:560px"><thead><tr><th style="text-align:left">last 7 days</th><th>now</th><th>longer-lived hits</th><th style="text-align:left">if below</th></tr></thead><tbody>
    ${AF.checks.map(([k, v, t, why]) => { const L = AFL[k]; const ok = v != null && v >= t, col = v == null ? 'var(--mut)' : ok ? 'var(--ok)' : v >= t * .9 ? 'var(--warn)' : 'var(--bad)';
      return `<tr><td class="name">${L[0]}</td><td class="mono" style="color:${col};font-weight:600">${v == null ? '—' : L[1](v)}</td>
        <td class="mono stud" title="${esc(why)}">≥ ${L[1](t)}</td><td style="text-align:left;font-size:13px">${v == null ? '<span class="stud">no data yet</span>' : ok ? '<span style="color:var(--ok)">✓ in line</span>' : esc(L[2])}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Thresholds = the median of 33 games that took off at 3 studios, first week after take-off: the half above lived about 1.5× longer and earned 4–7× more per peak player. A pattern, not a guarantee — the four go together.</p></div>`;
  const P = g.spend;
  const spendCard = !(P && P.days) ? '' : `<div class="vcard" style="border-left-color:var(--accent)"><div class="lab">Ad spend (estimate)</div>
    ${P.days ? `<div class="kpis" style="margin:8px 0 6px"><div class="kpi"><b>${usd(P.usd)}</b><span>${P.days} ad day${P.days === 1 ? '' : 's'} priced</span></div>
      <div class="kpi"><b>${usd(P.cpm)}</b><span>CPM (per 1000 impressions)</span></div><div class="kpi"><b>${usd(P.per_play)}</b><span>per ad play</span></div>
      <div class="kpi"><b style="color:${P.roi == null ? 'var(--mut)' : P.roi >= 1 ? 'var(--ok)' : P.roi >= .5 ? 'var(--warn)' : 'var(--bad)'}">${P.roi == null ? '—' : P.roi.toFixed(2) + '×'}</b><span>ROI · revenue ${usd(P.revenue_usd)}</span></div></div>` : ''}
    <p class="stud" style="font-size:13px;margin:6px 0 0">${P.days ? `Budget × days the game had ad impressions (${(P.impr || 0).toLocaleString('en-US')} impressions, ${(P.plays || 0).toLocaleString('en-US')} plays). Roblox doesn’t expose real spend in its API yet — this is the budget, with automated bids it is usually spent in full.` : ''}
    ${P.unpriced ? ` ${P.unpriced} day(s) with ads have no visible campaign — the ads were bought from an account whose key isn’t connected (connect that person’s personal key with <span class="mono">ad.campaign:read</span>).` : ''}
    ${P.running && P.running.length ? ` Running now: ${P.running.map(c => usd(c.budget_usd) + '/day ' + esc(c.objective)).join(', ')}.` : ''}</p></div>`;
  const devCard = deviceCard(g.devices);
  const url = rlink(g);
  shell('ads', `<div class="page wide"><a href="#ads" class="back"><span class="ar">←</span>Back</a>
    <div class="ptop" style="margin-top:16px"><div class="gcell">${gicon(g, 56)}<div><h2>${esc(g.name)}</h2>
    <div class="stud" style="font-size:12.5px">${esc(s.account)} · universe ${esc(g.universe)} · updated ${esc(s.updated)}${g.peak_dau != null ? ` · all time: peak DAU ${num(g.peak_dau)}` : ''}${g.revenue_total != null ? `, ${num(g.revenue_total)} R$ earned (≈ ${usd(g.revenue_total * C.DEVEX)})` : ''}${url ? ` · <a href="${url}" target="_blank" rel="noopener">open on Roblox ↗</a>` : ''}</div></div></div>
    <button class="eye ${hiddenSet().has(String(g.universe)) ? 'shut' : ''}" style="position:static;transform:none" onclick="toggleHide('${esc(g.universe)}')"
      title="${hiddenSet().has(String(g.universe)) ? 'Hidden — click to show it in Ads again' : 'Visible — click to hide it from Ads'}">${hiddenSet().has(String(g.universe)) ? EYE.shut : EYE.open}</button></div>
    ${act}${charts}${afterCard}${updCard}${monCard}${prodCard(g.aud)}${thumbCard(g.thumbs)}${spendCard}${body}${devCard}${perfCard(g.perf)}${audCard(g.aud)}${foot()}</div>`);
  if (S) drawGChart();
}

// ---------- the game page «Devices» card (devices.view): each device against the rest of the game's players ----------
const DEV_LVL = {bad: ['var(--bad)', 'Problem'], watch: ['var(--warn)', 'Watch'], ok: ['var(--ok)', 'OK'], few: ['var(--mut)', 'Too few players']};
const DEV_COLS = [['entry', 'click → play', v => fp(v)], ['n1', '1 min', v => fp(v)], ['n5', '5 min', v => fp(v)], ['pt', 'min', v => (+v).toFixed(1)],
  ['d1', 'D1', v => fp1(v)], ['pay', 'paid', v => fp1(v)]];   // wrapped: fp1 is declared further down
function deviceCard(D) {
  if (!D) return '';
  const [col, lab] = DEV_LVL[D.level] || DEV_LVL.ok;
  const cell = (c, f, n) => {
    const [v, lvl, e, z] = c;
    if (v == null) return '<td class="stud">—</td>';
    const color = lvl === 'bad' ? 'var(--bad)' : lvl === 'watch' ? 'var(--warn)' : lvl === 'few' ? 'var(--mut)' : 'var(--ink)';
    const tip = lvl === 'few' ? `Only ${n} new players on this device — too few to judge` : e == null ? '' : `Expected ~${f(e)} from the other devices (normal gap included)${z != null ? ' · z ' + z : ''}`;
    return `<td class="mono" style="color:${color};${lvl === 'bad' || lvl === 'watch' ? 'font-weight:600' : ''}" title="${esc(tip)}">${f(v)}${lvl === 'bad' ? ' ✗' : lvl === 'watch' ? ' ?' : ''}</td>`;
  };
  const rows = D.rows.map(r => `<tr><td class="name" style="white-space:nowrap"><span style="color:${DEV_LVL[r.level][0]}">●</span> ${esc(r.p)}</td>
    <td style="min-width:110px"><div class="track" title="${fp1(r.share)} of daily players"><div class="fill" style="width:${Math.max(2, Math.round(r.share * 100))}%;background:var(--accent)"></div></div>
      <div class="stud" style="font-size:11.5px">${fp(r.share)} · ${num(r.dau)}/day</div></td>
    <td class="mono">${num(r.new)}</td>${r.off
      ? `<td colspan="${DEV_COLS.length + 1}" style="text-align:left;color:var(--bad);font-weight:600">Not enabled — turn ${esc(r.p)} on in the experience settings and adapt the game: UI scaling, ${r.p === 'Console' ? 'gamepad controls and button hints' : 'controls'}</td>`
      : DEV_COLS.map(([k, , f]) => cell(r.cells[k], f, r.new)).join('') + `<td class="mono stud">${r.arpdau == null ? '—' : r.arpdau.toFixed(2)}</td>`}</tr>`).join('');
  const li = i => `<li style="margin:4px 0"><b style="color:${DEV_LVL[i.lvl][0]}">${i.lvl === 'bad' ? 'Problem' : 'Watch'}</b> — ${esc(i.text)}</li>`;
  const bad = D.issues.filter(i => i.lvl === 'bad'), watch = D.issues.filter(i => i.lvl === 'watch');
  const iss = (bad.length ? `<ul style="margin:6px 0 8px;padding-left:20px">${bad.map(li).join('')}</ul>`
      : `<p style="margin:6px 0 8px">${watch.length ? 'No clear device problem.' : 'No device problems: every device plays like the rest of this game’s players, within the normal gaps.'}</p>`)
    + (watch.length ? `<details style="margin:0 0 10px"><summary class="stud" style="cursor:pointer;font-size:13px">${watch.length} to watch — a gap, but not sure yet</summary>
      <ul style="margin:4px 0 0;padding-left:20px;font-size:13px">${watch.map(li).join('')}</ul></details>` : '');
  return `<div class="vcard" style="border-left-color:${col}"><div class="lab">Devices · ${esc(D.from)} – ${esc(D.to)} (${D.days} days) · <span style="color:${col}">${lab}</span></div>
    ${iss}
    <div class="tbl-wrap"><table class="tight" style="min-width:700px"><thead><tr><th style="text-align:left">device</th><th style="text-align:left">players</th><th title="new players in the window — the sample">new</th>
      ${DEV_COLS.map(([k, h]) => `<th${k === 'd1' || k === 'pay' ? ' class="stud" title="shown, not judged: depends on who plays on the device"' : ''}>${h}</th>`).join('')}<th title="R$ per player a day">R$/player</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Each device is compared with the <b>rest of this game's players</b>, corrected by the normal gap of that device across the ${D.norm_games || ''} games we track (console players click Play more and come back less everywhere — that is not a bug). Judged: <b>click → play</b> (loading too long or crashing on the device) and <b>1 min / 5 min / minutes</b> (controls and UI: scaling, missing buttons, no touch / gamepad input). D1 and paying players are shown, not judged — they follow from those and from who plays on the device. <b style="color:var(--bad)">✗ Problem</b> = 15%+ below expected, further off than games normally differ, and too big to be chance; <b style="color:var(--warn)">? Watch</b> = a smaller or less certain gap. Under 30 new players a device is never judged (grey): five console players leaving is noise, not a bug; under 100 it is at most Watch. Hover a cell for the expected value.</p></div>`;
}

// ---------- game page: Stability (perf.view), Thumbnails (thumbs.view), Audience + Products (audience.view) ----------
const LV = {bad: ['var(--bad)', 'Problem'], watch: ['var(--warn)', 'Watch'], ok: ['var(--ok)', 'OK'], few: ['var(--mut)', 'Too few players']};
const lvColor = l => l === 'bad' ? 'var(--bad)' : l === 'watch' ? 'var(--warn)' : l === 'few' ? 'var(--mut)' : 'var(--ink)';
const lvMark = l => l === 'bad' ? ' ✗' : l === 'watch' ? ' ?' : '';
const lvCell = (txt, l, tip) => `<td class="mono" style="color:${lvColor(l)};${l === 'bad' || l === 'watch' ? 'font-weight:600' : ''}" title="${esc(tip || '')}">${txt}${lvMark(l)}</td>`;
function issueList(I, okText) {
  const li = i => `<li style="margin:4px 0"><b style="color:${LV[i.lvl][0]}">${i.lvl === 'bad' ? 'Problem' : 'Watch'}</b> — ${esc(i.text)}</li>`;
  const bad = I.filter(i => i.lvl === 'bad'), watch = I.filter(i => i.lvl === 'watch');
  return (bad.length ? `<ul style="margin:6px 0 8px;padding-left:20px">${bad.map(li).join('')}</ul>` : `<p style="margin:6px 0 8px">${okText}</p>`)
    + (watch.length ? `<details style="margin:0 0 10px"${bad.length ? '' : ' open'}><summary class="stud" style="cursor:pointer;font-size:13px">${watch.length} to watch</summary>
      <ul style="margin:4px 0 0;padding-left:20px;font-size:13px">${watch.map(li).join('')}</ul></details>` : '');
}

function perfCard(P) {
  if (!P || !P.rows || !P.rows.length) return '';
  const [col, lab] = LV[P.level] || LV.ok;
  const pc2 = v => v == null ? '—' : (v * 100).toFixed(2) + '%';
  const usual = (e, f) => e == null ? 'no norm yet (needs 5+ of our games with this device)' : 'our games usually ' + f(e);
  const rows = P.rows.map(r => `<tr><td class="name" style="white-space:nowrap"><span style="color:${LV[r.level][0]}">●</span> ${esc(r.p)}</td>
    <td class="mono">${r.dau == null ? '—' : num(r.dau)}</td>
    ${lvCell(r.crash == null ? '—' : pc2(r.crash) + ` <span class="stud">(${num(r.crash_n)})</span>`, r.lv.crash, usual(r.crash_e, pc2))}
    ${lvCell(r.fps10 == null ? '—' : Math.round(r.fps10), r.lv.fps10, usual(r.fps10_e, v => Math.round(v) + ' FPS'))}
    <td class="mono stud">${r.fps50 == null ? '—' : Math.round(r.fps50)}</td>
    ${lvCell(r.mem == null ? '—' : fp(r.mem), r.lv.mem, '90% of devices use less of their memory than this; near 100% the game is killed')}
    ${lvCell(num(r.oom) + (r.oom_k == null ? '' : ` <span class="stud">(${r.oom_k.toFixed(1)}/1k)</span>`), r.lv.oom, usual(r.oom_e, v => v.toFixed(1) + ' per 1000 player-days'))}</tr>`).join('');
  const V = P.versions || [];
  const vers = V.length < 2 ? '' : `<details style="margin:8px 0 0"><summary class="stud" style="cursor:pointer;font-size:13px">Crashes by published version${P.ver_note ? ` — <b style="color:${LV[P.ver_note.lvl][0]}">version ${esc(P.ver_note.ver)}: ×${P.ver_note.ratio}</b>` : ''}</summary>
    <div class="tbl-wrap"><table class="tight" style="min-width:380px;margin-top:6px"><thead><tr><th style="text-align:left">version</th><th>live since</th><th>crashes</th><th>of sessions</th></tr></thead><tbody>
    ${V.map(v => `<tr><td class="name mono">${esc(v.ver)}</td><td class="mono stud">${esc(v.first || '')}</td><td class="mono">${num(v.n)}</td><td class="mono">${pc2(v.rate)}</td></tr>`).join('')}</tbody></table></div></details>`;
  return `<div class="vcard" style="border-left-color:${col}"><div class="lab">Stability · ${esc(P.from)} – ${esc(P.to)} (${P.days} days) · <span style="color:${col}">${lab}</span></div>
    ${issueList(P.issues || [], 'No stability problems: crashes, frame rate and memory are in line with our other games on every device.')}
    <div class="tbl-wrap"><table class="tight" style="min-width:640px"><thead><tr><th style="text-align:left">device</th><th>players/day</th>
      <th title="crashes ÷ ended sessions (count in brackets — under ~20 crashes the % is noise)">crash rate</th><th title="frames per second of the slowest 10% of moments">FPS slow 10%</th>
      <th class="stud" title="typical frames per second (shown, not judged)">FPS typical</th><th title="share of the device's memory used by the heaviest 10% of devices">memory</th><th title="the game killed for running out of memory (per 1000 player-days)">out of memory</th></tr></thead><tbody>${rows}</tbody></table></div>${vers}
    <p class="hint" style="margin:8px 0 0">Roblox keeps performance data only 28 days — the site archives it every collection. Each device is compared with the <b>same device in our other games</b> (${P.norm_games || 0} archived): some platforms crash more everywhere, that is not this game. <b style="color:var(--bad)">✗</b> = crash rate 2× the usual with 20+ crashes, slowest frames under 60% of usual, memory over 85%, or out-of-memory exits 4× the usual; <b style="color:var(--warn)">?</b> = a smaller gap. Thresholds are a first guess (there was no history to test them on) — treat a flag as «look at the Error Report», not a verdict. Under 30 players a day a device is not judged.</p></div>`;
}

function thumbCard(T) {
  if (!T || !T.rows || !T.rows.length) return '';
  const pc2 = v => v == null ? '—' : (v * 100).toFixed(2) + '%';
  const tag = {best: ['var(--ok)', 'best'], replace: ['var(--bad)', 'replace'], few: ['var(--mut)', 'too few impressions'], ok: ['var(--ink)', '']};
  const lvl = T.rows.some(r => r.level === 'replace') ? 'watch' : 'ok';
  const tiles = T.rows.map(r => { const [c, t] = tag[r.level] || tag.ok;
    return `<div style="border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)">
      ${r.img ? `<img src="${esc(r.img)}" alt="" loading="lazy" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block">` : `<div class="stud" style="aspect-ratio:16/9;display:grid;place-items:center">no image</div>`}
      <div style="padding:8px 10px;font-size:12.5px">
        <div class="track" title="${fp1(r.share)} of Home impressions"><div class="fill" style="width:${Math.max(2, Math.round(r.share * 100))}%;background:var(--accent)"></div></div>
        <div style="display:flex;justify-content:space-between;gap:6px;margin-top:4px"><span class="mono">${fp1(r.share)} · ${fk(r.impr)}</span>${t ? `<b style="color:${c}">${t}</b>` : ''}</div>
        <div class="stud" title="qualified plays ÷ impressions; in brackets the other pictures together">play-through ${pc2(r.qptr)}${r.rest != null ? ` <span style="opacity:.8">(rest ${pc2(r.rest)})</span>` : ''}</div>
        <div class="stud">${r.sess != null ? r.sess + ' min a session' : ''}${r.l7 != null ? ` · 7-day ${pc2(r.l7)}` : ''}</div>
        <div class="stud mono" style="font-size:11px">${esc(r.asset)}</div></div></div>`; }).join('');
  return `<div class="vcard" style="border-left-color:${lvl === 'watch' ? 'var(--warn)' : 'var(--accent)'}"><div class="lab">Thumbnails on Home · ${esc(T.from)} – ${esc(T.to)} · ${fk(T.impr)} impressions · play-through ${pc2(T.qptr)}</div>
    <p style="margin:6px 0 10px">${esc(T.verdict)}</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">${tiles}</div>
    <p class="hint" style="margin:8px 0 0">Roblox rotates the game's thumbnails on Home and moves impressions to the one that brings more qualified plays — the impression share is its own verdict. <b style="color:var(--bad)">replace</b> = 3000+ impressions and under 70% of the other pictures' play-through, too big to be chance; <b style="color:var(--ok)">best</b> = 30%+ above them. Roblox keeps this only 30 days — the site archives it.</p></div>`;
}

function audCard(A) {
  if (!A) return '';
  const I = (A.issues || []).filter(i => i.card !== 'prod');
  const level = I.some(i => i.lvl === 'bad') ? 'bad' : I.some(i => i.lvl === 'watch') ? 'watch' : 'ok';
  const [col, lab] = LV[level];
  const rows = (A.langs || []).map(r => `<tr><td class="name" style="white-space:nowrap"><span style="color:${LV[r.level] ? LV[r.level][0] : 'var(--mut)'}">●</span> ${esc(r.lang)}</td>
    <td style="min-width:110px"><div class="track"><div class="fill" style="width:${Math.max(2, Math.round(r.share * 100))}%;background:var(--accent)"></div></div><div class="stud" style="font-size:11.5px">${fp(r.share)} of new players</div></td>
    <td class="mono">${num(r.new)}</td>
    ${r.pt == null ? '<td class="stud">—</td>' : lvCell(r.pt.toFixed(1), r.level, r.pt_e != null ? `expected ~${r.pt_e.toFixed(1)} from the game's other players (normal gap of this language included)` : '')}
    <td class="mono stud" title="${r.d1_rest != null ? 'other players ' + fp1(r.d1_rest) : ''}">${fp1(r.d1)}</td></tr>`).join('');
  const kp = (v, t) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`;
  return `<div class="vcard" style="border-left-color:${col}"><div class="lab">Audience · ${esc(A.from)} – ${esc(A.to)} (${A.days} days) · <span style="color:${col}">${lab}</span></div>
    ${issueList(I, 'No language plays clearly worse than the rest of the game’s players.')}
    <div class="kpis" style="margin:4px 0 10px">
      ${kp(A.spender == null ? '—' : fp(A.spender), `spent Robux on Roblox in 60 days${A.spender_norm != null ? ` · our median ${fp(A.spender_norm)}` : ''}`)}
      ${kp(A.abuse == null ? '—' : A.abuse.toFixed(1), `abuse reporters per 1000 playtime hours${A.abuse_norm != null ? ` · our median ${A.abuse_norm.toFixed(1)}` : ''}`)}</div>
    ${rows ? `<div class="tbl-wrap"><table class="tight" style="min-width:520px"><thead><tr><th style="text-align:left">language</th><th style="text-align:left">players</th><th>new</th><th title="minutes per new player — judged">min</th><th class="stud" title="shown, not judged">D1</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
    <p class="hint" style="margin:8px 0 0">Language = the player's Roblox language. Each language's new players are compared with the <b>rest of this game's players</b>, corrected by that language's normal gap in our games (${A.norm_games || 0}). Much shorter play in one language usually means the first minutes need text that player can't read — Roblox auto-translation skips text in images, signs and abbreviations. «Spent Robux» = bought anything on Roblox in 60 days — how much of the audience pays at all; context for prices, not a verdict.</p></div>`;
}

function prodCard(A) {
  const P = A && A.products;
  if (!P || (!P.items.length && !P.n_catalog)) return '';
  const I = (A.issues || []).filter(i => i.card === 'prod');
  const rows = P.items.map(i => `<tr><td class="name">${esc(i.name)}</td><td class="stud">${i.type === 'GamePass' ? 'pass' : i.type === 'DevProduct' ? 'product' : esc(i.type)}</td>
    <td class="mono" style="${i.price === 1 ? 'color:var(--bad);font-weight:600' : ''}">${i.price == null ? '—' : num(i.price)}</td><td class="mono">${num(i.rs)}</td>
    <td style="min-width:90px"><div class="track"><div class="fill" style="width:${Math.max(2, Math.round((i.share || 0) * 100))}%;background:var(--ok)"></div></div><div class="stud" style="font-size:11.5px">${fp(i.share)}</div></td>
    <td class="mono stud" title="R$ ÷ price — regional pricing makes it approximate">${i.units == null ? '—' : '~' + num(i.units)}</td></tr>`).join('');
  return `<div class="vcard" style="border-left-color:var(--ok)"><div class="lab">Products · last ${P.days} days · ${num(P.rs)} R$ spent on the game's items</div>
    ${I.length ? issueList(I, '') : ''}
    ${rows ? `<div class="tbl-wrap"><table class="tight" style="min-width:560px"><thead><tr><th style="text-align:left">item</th><th></th><th>price R$</th><th>R$ spent</th><th style="text-align:left">share</th><th title="approximate number of purchases">~buys</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="stud">No item sold in this window.</p>'}
    <p class="stud" style="font-size:12.5px;margin:6px 0 0">${P.n_items > P.items.length ? `Top ${P.items.length} of ${P.n_items} items that sold. ` : ''}${P.n_unsold ? `${P.n_unsold} item(s) on sale sold nothing: ${P.unsold.map(esc).join(', ')}${P.n_unsold > P.unsold.length ? '…' : ''}. ` : ''}${P.avatar_rs ? `Avatar items bought in the game: ${num(P.avatar_rs)} R$ (a commission). ` : ''}Robux spent by players — you get about 70%.</p></div>`;
}

// ---------- the game page chart: pick a metric, switch lines on/off, compare with your other games ----------
let GV = null;
const fp1 = v => v == null ? '—' : (v * 100).toFixed(1) + '%';   // share with one decimal (paying players)
const METRICS = [['home', 'Home impressions', fk, true], ['ad', 'Ad impressions', fk, true], ['dau', 'Daily active users', fk, true],
  ['n5', 'Still playing at 5 min', fp, true], ['pt', 'Minutes per new player', v => v == null ? '—' : (+v).toFixed(1), false],
  ['d1', 'Day-1 return', fp, false], ['rev', 'Revenue, R$', fk, false],
  ['arp', 'R$ per player', v => v == null ? '—' : (+v).toFixed(2), false], ['cvr', 'Paying players', fp1, false]];
const CMP_COLORS = ['#9085e9', '#c98500', '#d55181'];
// calendar date of day i of a launch (day 0 = start, UTC) — charts count days since launch, people think in dates
const dayDate = (start, i) => { if (!start || i == null) return ''; const d = new Date(start + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + i);
  return d.getUTCDate() + ' ' + 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[d.getUTCMonth()]; };   // not toLocale: en-GB says «Sept»
// how late Roblox delivers each metric (measured 2026-10-12): daily analytics close the day ~1–2 days later,
// D1 needs the next day on top, revenue lags 2 days. Live ones (CCU, thumbnail impressions) are not on this chart.
const LAG = {home: '1–2 days late', ad: '1–2 days late', dau: '1–2 days late', n5: '1–2 days late', pt: '1–2 days late',
  d1: '2–3 days late (players must come back the next day)', rev: '2 days late', arp: '2 days late', cvr: '2 days late'};
const UPD_COLOR = '#e3b341';   // update markers on the game chart
const UPD_W = 3;   // = siteviews.UPD_WINDOW   // after blue / aqua / orange — validated in this order
window.addEventListener('resize', () => { clearTimeout(window.__gr); window.__gr = setTimeout(() => { if (document.getElementById('gchart')) drawGChart(); }, 150); });
function gvToggle(k) { GV.show[k] = !GV.show[k]; drawGChart(); }
function gvMetric(k) { GV.metric = k; drawGChart(); }
function gvRange(r) { GV.range = r; drawGChart(); }
function gvAdd(u) { if (u && GV.cmp.length < 3 && !GV.cmp.includes(u)) GV.cmp.push(u); drawGChart(); }
function gvDel(u) { GV.cmp = GV.cmp.filter(x => x !== u); drawGChart(); }
function drawGChart() {
  const el = document.getElementById('gchart'); if (!el || !GV) return;
  const g = GV.g, S = g.series, Bm = ME.ads.bench, [mk, mlab, fmt, hasBench] = METRICS.find(m => m[0] === GV.metric);
  const others = allRows().filter(r => r.series && String(r.universe) !== String(g.universe));
  const byU = Object.fromEntries(others.map(r => [String(r.universe), r]));
  const lines = [{k: 'game', name: 'This game', color: SER.game, vals: S[mk]}];
  if (hasBench && Bm) lines.push({k: 'hit', name: `Median hit (${Bm.games.win})`, color: SER.hit, dash: '7 5', vals: Bm['win_' + mk]},
    {k: 'fail', name: `Median fail (${Bm.games.fail})`, color: SER.fail, dash: '2 5', vals: Bm['fail_' + mk]});
  GV.cmp.forEach((u, i) => { const r = byU[u]; if (r) lines.push({k: 'c' + u, u, name: r.name.slice(0, 26), color: CMP_COLORS[i], vals: r.series[mk]}); });
  const shown = lines.filter(l => GV.show[l.k] !== false);
  const full = Math.max(...lines.map(l => (l.vals || []).length), 2);
  const n = GV.range ? Math.min(GV.range, full) : Math.min(full, 60);
  // headline: this game's latest value in range and its change over 7 days (like Roblox's KPI on top of a chart)
  const gv = (S[mk] || []).slice(0, n), li = gv.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
  const last = li != null ? gv[li] : null, prev = li != null && li >= 7 ? gv[li - 7] : null;
  const ch = last != null && prev ? (last - prev) / prev : null;
  const badge = ch == null ? '' : `<span class="kch ${ch >= 0 ? 'up' : 'dn'}">${ch >= 0 ? '↑' : '↓'} ${Math.abs(ch * 100).toFixed(1)}%</span>`;
  const chips = METRICS.map(([k, l]) => `<a class="chip ${GV.metric === k ? 'on' : ''}" onclick="gvMetric('${k}')">${l}</a>`).join('');
  const legend = lines.map(l => `<a class="lgi ${GV.show[l.k] !== false ? '' : 'off'}" onclick="gvToggle('${l.k}')" title="click to show / hide">
    <span class="ldot" style="background:${l.color}"></span>${esc(l.name)}${l.u ? `<span class="x" onclick="event.stopPropagation();gvDel('${l.u}')" title="remove">×</span>` : ''}</a>`).join('')
    + (S.unlock != null ? `<span class="lgi static"><span class="lmk"></span>open to kids · day ${S.unlock}</span>` : '')
    + ((S.ver || []).length ? `<span class="lgi static"><span class="lmk" style="border-color:${UPD_COLOR}"></span>update published (${S.ver.length} day${S.ver.length === 1 ? '' : 's'})</span>` : '');
  const pick = GV.cmp.length < 3 && others.length ? `<select class="inp" style="width:auto;max-width:250px;padding:7px 10px;font-size:12.5px" onchange="gvAdd(this.value)">
    <option value="">+ Compare with another game</option>${others.slice(0, 200).map(r => `<option value="${esc(r.universe)}">${esc(r.name.slice(0, 40))}</option>`).join('')}</select>` : '';
  const ranges = [[21, 'First 21 days'], [0, `All ${Math.min(full, 60)} days`]].map(([r, l]) =>
    `<option value="${r}" ${GV.range === r ? 'selected' : ''}>${l}</option>`).join('');
  const chart = shown.some(l => (l.vals || []).some(v => v != null))
    ? lineChart({n, fmt, series: shown, xl: g.start ? Array.from({length: n}, (_, i) => `d${i} · ${dayDate(g.start, i)}`) : null, markers: (S.unlock != null ? [{x: S.unlock, label: 'Opened to kids'}] : [])
        .concat((S.ver || []).map(([x, c]) => ({x, color: UPD_COLOR, label: c > 1 ? `Update published ×${c}` : 'Update published'}))), label: mlab,
        W: Math.max(320, Math.round(el.clientWidth || 900)), H: window.innerWidth < 640 ? 240 : 320})
    : '<p class="stud" style="padding:40px 0;text-align:center">No data for this metric.</p>';
  el.innerHTML = `<div class="chips" style="margin:0 0 16px">${chips}</div>
    <div class="ghead"><div><div class="gtitle">${esc(mlab)}</div><div class="stud" style="font-size:13px;margin-top:2px">Daily, by day since launch${g.start ? ` (day 0 = ${dayDate(g.start, 0)})` : ''}${li != null ? ` · latest: day ${li}${g.start ? ', ' + dayDate(g.start, li) : ''}` : ''}${LAG[mk] ? ` · Roblox reports it ${LAG[mk]}` : ''}</div>
    <div class="kbig">${last == null ? '—' : fmt(last)} ${badge}</div></div>
    <div class="gctl"><select class="inp" style="width:auto;padding:7px 10px;font-size:12.5px" onchange="gvRange(+this.value)">${ranges}</select>${pick}</div></div>
    ${chart}<div class="legend2">${legend}</div>
    <p class="hint" style="margin:10px 0 0;text-align:center">Day 0 = first day with 20+ players or ads · medians: launches since the 16+ gate${hasBench ? '' : ' (not available for this metric)'} · the change badge compares with 7 days earlier</p>`;
}

// ---------- launches: the pooled playbook (no game names) ----------
const pc = v => (v === null || v === undefined) ? '—' : Math.round(v * 100) + '%';
const kk = v => (v === null || v === undefined) ? '—' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(Math.round(v));
function rateCell(r) {
  if (!r || !r.n) return `<td style="text-align:right;color:var(--mut)">—</td>`;
  const p = r.win / r.n, c = p >= .67 ? 'var(--ok)' : p >= .4 ? 'var(--warn)' : 'var(--bad)';
  return `<td style="text-align:right"><b style="color:${c}">${Math.round(p * 100)}%</b> <span class="stud">${r.win}/${r.n}</span></td>`;
}
function bucketTable(title, rows, fmt, note) {
  const body = rows.map(b => `<tr><td class="name">${b.hi === null ? '≥ ' + fmt(b.lo) : fmt(b.lo) + ' – ' + fmt(b.hi)}</td>${rateCell(b)}</tr>`).join('');
  return `<div class="vcard"><div class="lab">${esc(title)}</div>
    <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>range</th><th>took off</th></tr></thead><tbody>${body}</tbody></table></div>
    ${note ? `<p class="hint" style="margin:8px 0 0">${esc(note)}</p>` : ''}</div>`;
}
function oddsTable(o) {   // odds.py: chance to take off by step of the launch
  const rows = [['Days 1–3: D1 under 4%', o.low], ['Days 1–3: D1 4%+, under 7 min per new player', o.mid],
    ['Days 1–3: D1 4%+, 7+ min per new player', o.ok], ['Ignition: Home ≥×1.5 a day for 2 days at 5k+', o.ign]];
  return `<div class="vcard"><div class="lab">Chance to take off — reached 20k Home impressions a day</div>
    <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>what the game showed</th><th>took off</th></tr></thead>
    <tbody>${rows.map(([l, r]) => `<tr><td class="name">${l}</td>${rateCell(r)}</tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Share of launches since the 16+ gate that showed the same and took off. Small samples: read “9/19” as “about half”, not as an exact percent.</p></div>`;

      ${ed ? `<div class="chips" style="margin:10px 0 0;align-items:center"><input class="inp" id="trn" placeholder="a new role" style="width:170px;padding:7px 9px"

  shell('team', `<div class="page wide tpage"><div class="ptop"><h2>Team</h2>
      ${opts.length > 1 ? `<select class="inp" style="width:auto;min-width:200px;padding:7px 10px" title="whose games: the library and “needs someone now”" onchange="store.set('ranalytics.teamScope',this.value);route()">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>` : ''}</div>
    <div class="livebar"><span class="dot ${ed ? 'on' : ''}"></span><span>${ed ? 'Drag a name onto a card · drag a card between Planned / In progress / Done · drag a game from the library onto the board · or tap a name, then a card.' : 'Read-only: the team is edited on the owner’s PC with the server running.'}</span></div>
    ${TEAM_ERR && !modal ? `<div class="err" style="margin:0 0 12px">${esc(TEAM_ERR)}</div>` : ''}
    ${TEAM_SEL && P[TEAM_SEL] ? `<div class="tselbar">${pava(P[TEAM_SEL].name, 24)} Tap a card to put <b>${esc(P[TEAM_SEL].name)}</b> on it · <a onclick="teamSel(null)" style="cursor:pointer">cancel</a></div>` : ''}
    <div class="tkpis">${kpi(urgent.length, 'need someone now', 'var(--bad)')}${kpi(free.length, 'free', 'var(--ok)')}${kpi(busyP.length, 'busy', 'var(--warn)')}${kpi(T.projects.filter(r => r.status === 'progress').length, 'in progress', 'var(--accent)')}</div>
    <div class="thero">
      <div class="tpanel turgent"><div class="tp-h">🔥 Needs someone now <span class="tcnt">${urgent.length}</span></div>
        <div class="stud" style="font-size:12px;margin:-4px 0 10px">a fix to ship or a new game — and nobody on it</div>
        ${urgent.length ? `<div class="ulist">${urgent.map(ucard).join('')}</div>` : '<div class="tp-empty">✓ Every game that needs work has someone on it.</div>'}</div>
      <div class="tpanel tfree tdrop" ${ed ? `ondragover="tOver(event,'a')" ondragleave="tLeave(event)" ondrop="tDropFree(event)"` : ''}>
        <div class="tp-h">Free now <span class="tcnt">${free.length}</span></div>
        ${free.length ? `<div class="pgrid">${free.map(pcard).join('')}</div>` : `<div class="tp-empty">${T.people.length ? 'Everyone is on a game.' : 'Add your people at the bottom (People → + Add a person).'}</div>`}
        ${busyP.length ? `<div class="tp-h" style="margin-top:16px;font-size:13.5px">Busy <span class="tcnt">${busyP.length}</span></div>${busyP.map(brow).join('')}` : ''}</div>
    </div>
    <h3 class="sh">Board</h3>
    <div class="tboard3">${TSTAT.map(col).join('')}</div>
    <div class="ptop" style="margin-top:24px"><h3 class="sh" style="margin:0">Library <span class="stud" style="font-size:12.5px;font-weight:400">games not on the board, newest first — drag one onto a column</span></h3>
      <div class="chips" style="align-items:center">
        <a class="chip ${tmode === 'shown' ? 'on' : ''}" style="cursor:pointer" onclick="store.set('ranalytics.teamMode','shown');route()">Shown (${libShown.length})</a>
        <a class="chip ${tmode === 'hidden' ? 'on' : ''}" style="cursor:pointer" onclick="store.set('ranalytics.teamMode','hidden');route()">Hidden (${libHid.length})</a>
        ${tmode === 'shown' && stale.length ? armBtn('hideold', `hide ${stale.length} old ones`, `sure? hide ${stale.length} (Team and Ads)`, `teamHideOld(${esc(JSON.stringify(stale.map(g => String(g.universe))))})`) : ''}</div></div>
    ${libList.length ? `<div class="tgrid">${libList.map(lcard).join('')}</div>` : `<p class="stud" style="margin-top:12px">${tmode === 'hidden' ? 'Nothing hidden.' : 'Every game is on the board.'}</p>`}
    ${manage}
    <p class="hint">Board = what you put there. A name dropped on a library game puts it In progress; a name on a Planned or Done card moves it to In progress; Done frees everyone on it. Planned cards are typed by hand — when a game with a similar name is published, the card offers to link it. The eye hides a library game here and on Ads. Private (unpublished) games are not visible without a Roblox login.</p>${foot()}</div>
    ${modalHtml}${TEAM_TOAST ? `<div class="ttoast">${esc(TEAM_TOAST)}</div>` : ''}`);
  if (TEAM_TOAST) { TEAM_TOAST = ''; setTimeout(() => { const t = document.querySelector('.ttoast'); if (t) t.classList.add('gone'); }, 2200); }
}
function teamHideOld(ids) {   // one click: the dead weight goes to Hidden (the same list as Ads)
  const h = hiddenSet(); for (const u of ids) h.add(String(u));
  store.set('ranalytics.hidden', JSON.stringify([...h])); route();
}

function foot() { return `<footer class="site">Updated ${esc(V.generated)}</footer>`; }

(async () => {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    $app.innerHTML = '<div class="boot">This browser is too old for this page — open it in a current Chrome, Edge, Firefox or Safari.</div>';
    return;
  }
  const k = store.get('ranalytics.k');
  const me = k && await unlock(k);
  if (me) enter(k, me); else { store.del('ranalytics.k'); loginView(); }
})();
</script></body></html>
