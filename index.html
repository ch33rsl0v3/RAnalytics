const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function gunzip(buf) {
  const s = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(s).text();
}
async function openBox(key, box) {
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(box.iv)}, key, unb64(box.ct));
  return gunzip(pt);
}
async function slotId(k) {
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('ranalytics:' + k)));
  return [...h].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 24);
}
async function freshVault() {   // the browser / GitHub may still hold an older page (new login just added)
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/<script id="vault" type="application\/json">([\s\S]*?)<\/script>/);
    if (m) { V = JSON.parse(m[1]); return true; }
  } catch (e) {}
  return false;
}
async function unlock(k) {
  let s = V.slots[await slotId(k)];
  if (!s && await freshVault()) s = V.slots[await slotId(k)];
  if (!s) return null;
  const base = await crypto.subtle.importKey('raw', enc.encode(k), 'PBKDF2', false, ['deriveKey']);
  const ku = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: unb64(s.salt), iterations: V.iter, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  try { return JSON.parse(await openBox(ku, s)); } catch (e) { return null; }
}

async function enter(k, me) {
  KEY = k; ME = me;

    try {
      const ka = await crypto.subtle.importKey('raw', unb64(me.ka), 'AES-GCM', false, ['decrypt']);
      DASH_URL = URL.createObjectURL(new Blob([await openBox(ka, V.analytics)], {type: 'text/html'}));
    } catch (e) { DASH_URL = null; }

        : e.launch ? '<td class="stud" colspan="5">launch-day update — no days before it to compare with</td>'
        : dlt(e.n5, fp, true) + dlt(e.pt, v => (+v).toFixed(1), false) + dlt(e.d1, fp, true) + dlt(e.dau, fk, false) + dlt(e.rev, fk, false)) + '</tr>').join('')}
    </tbody></table></div>
    <p class="hint" style="margin:8px 0 0"><b>Verdict</b> — an update is not a failure unless CCU or playtime drops more than 15%. CCU = the 6 hours after the publish against the same hours 1 and 2 weeks earlier, set against the same for the 6 hours before it — so the hour of the day, the weekday and the game’s own slide going in all cancel out (“raw” = plain after ÷ before, mostly the clock). Playtime = minutes per new player, the same way by day.<br>Averages of the ${UPD_W} days before and after the publish day. Under each cell: the “after” days against the <b>same weekdays 1 and 2 weeks earlier</b> — weekends run ~1.5× a weekday, so a before → after drop that only crosses from Sunday into Monday is not the update. A real update effect shows in both lines. A game past its peak falls anyway — read big jumps, not small ones.</p></div>`;
  const M = g.money, MB = s.money_bench || {};
  const monAdvice = m => m.dau < 100 ? 'Too few players to judge monetization yet.'
    : m.cvr != null && m.cvr < 0.01 ? `Only ${fp1(m.cvr)} of players pay. Add a cheap starter pack (5–15 R$ — a 1 R$ item pays you 0) and show it in the first minutes.`
    : m.arppu != null && m.arppu < 20 ? `Players are willing to pay (${fp1(m.cvr)}), but each payer spends only ~${m.arppu} R$ a day — add pricier things: a VIP or x2 pass at 99–399 R$, bundles.`
    : 'Monetization is in line — grow players and returns rather than prices.';
  const cmp = (v, b, f) => v == null || b == null ? '' : `<span class="stud" style="font-size:11.5px">your median ${f(b)}</span>`;
  const monCard = !(M && M.dau) ? '' : `<div class="vcard" style="border-left-color:var(--ok)"><div class="lab">Monetization · last ${M.days} day${M.days === 1 ? '' : 's'}</div>
    <div class="kpis" style="margin:8px 0 6px">
      <div class="kpi"><b>${fk(M.rev_day)}</b><span>R$ a day · ${fk(M.total)} in total</span></div>
      <div class="kpi"><b>${M.arpdau == null ? '—' : M.arpdau.toFixed(2)}</b><span>R$ per player a day ${cmp(M.arpdau, MB.arpdau, v => v.toFixed(2))}</span></div>
      <div class="kpi"><b>${fp1(M.cvr)}</b><span>players who paid ${cmp(M.cvr, MB.cvr, fp1)}</span></div>
      <div class="kpi"><b>${M.arppu == null ? '—' : M.arppu}</b><span>R$ per paying player a day</span></div></div>
    <p style="margin:8px 0 0">${esc(monAdvice(M))}</p>
    <p class="stud" style="font-size:12.5px;margin:6px 0 0">Median over your games with 500+ players (${MB.n || 0}). Payers come back about twice as often as non-payers — a first purchase is worth more than its price. Curves: «R$ per player» and «Paying players» on the chart above.</p></div>`;
  const AF = g.after, AFL = {   // after take-off checklist (siteviews._after_takeoff)
    home_d1: ['Home D1 — Home players back next day', fp, 'Give them a reason for tomorrow: a daily reward, an unfinished timer / egg / build.'],
    home_d7: ['Home D7 — still here a week later', fp1, 'Add a week-long goal: rebirths or a collection, a new zone or event in week 2.'],
    pt: ['Minutes per new player', v => (+v).toFixed(1), 'Longer first session: the next goal always on screen, a reward every 1–2 minutes.'],
    arpdau: ['R$ per player a day', v => (+v).toFixed(2), 'Monetize the wave now — it won’t last: x2 / VIP pass at 99–399 R$, a 5–15 R$ starter pack, bundles.']};
  const afterCard = !AF ? '' : `<div class="vcard" style="border-left-color:var(--ok)"><div class="lab">After take-off — make it last${AF.day != null ? ` · day ${AF.day} since take-off` : ''}${AF.dau_share != null ? ` · DAU now ${Math.round(AF.dau_share * 100)}% of its peak` : ''}</div>
    <p style="margin:6px 0 10px">A typical hit’s Home impressions peak about ${AF.peak_at} days after take-off; around day ${AF.life} its DAU is under a third of the peak.
    ${AF.day == null ? '' : AF.day <= 7 ? '<b>Week 1: monetization</b> — the most players you will ever have are here now.' : AF.day <= AF.peak_at ? '<b>Week 2: a content update for day-7 returns</b>, and start the next game.' : AF.day <= AF.life ? '<b>Past the usual peak:</b> keep earning, put the main effort into the next game.' : '<b>Longer than a typical hit already</b> — keep the content coming while it pays.'}</p>
    <div class="tbl-wrap"><table style="min-width:560px"><thead><tr><th style="text-align:left">last 7 days</th><th>now</th><th>longer-lived hits</th><th style="text-align:left">if below</th></tr></thead><tbody>
    ${AF.checks.map(([k, v, t, why]) => { const L = AFL[k]; const ok = v != null && v >= t, col = v == null ? 'var(--mut)' : ok ? 'var(--ok)' : v >= t * .9 ? 'var(--warn)' : 'var(--bad)';
      return `<tr><td class="name">${L[0]}</td><td class="mono" style="color:${col};font-weight:600">${v == null ? '—' : L[1](v)}</td>
        <td class="mono stud" title="${esc(why)}">≥ ${L[1](t)}</td><td style="text-align:left;font-size:13px">${v == null ? '<span class="stud">no data yet</span>' : ok ? '<span style="color:var(--ok)">✓ in line</span>' : esc(L[2])}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Thresholds = the median of 33 games that took off at 3 studios, first week after take-off: the half above lived about 1.5× longer and earned 4–7× more per peak player. A pattern, not a guarantee — the four go together.</p></div>`;
  const P = g.spend;
  const spendCard = !(P && P.days) ? '' : `<div class="vcard" style="border-left-color:var(--accent)"><div class="lab">Ad spend (estimate)</div>
    ${P.days ? `<div class="kpis" style="margin:8px 0 6px"><div class="kpi"><b>${usd(P.usd)}</b><span>${P.days} ad day${P.days === 1 ? '' : 's'} priced</span></div>
      <div class="kpi"><b>${usd(P.cpm)}</b><span>CPM (per 1000 impressions)</span></div><div class="kpi"><b>${usd(P.per_play)}</b><span>per ad play</span></div>
      <div class="kpi"><b style="color:${P.roi == null ? 'var(--mut)' : P.roi >= 1 ? 'var(--ok)' : P.roi >= .5 ? 'var(--warn)' : 'var(--bad)'}">${P.roi == null ? '—' : P.roi.toFixed(2) + '×'}</b><span>ROI · revenue ${usd(P.revenue_usd)}</span></div></div>` : ''}
    <p class="stud" style="font-size:13px;margin:6px 0 0">${P.days ? `Budget × days the game had ad impressions (${(P.impr || 0).toLocaleString('en-US')} impressions, ${(P.plays || 0).toLocaleString('en-US')} plays). Roblox doesn’t expose real spend in its API yet — this is the budget, with automated bids it is usually spent in full.` : ''}
    ${P.unpriced ? ` ${P.unpriced} day(s) with ads have no visible campaign — the ads were bought from an account whose key isn’t connected (connect that person’s personal key with <span class="mono">ad.campaign:read</span>).` : ''}
    ${P.running && P.running.length ? ` Running now: ${P.running.map(c => usd(c.budget_usd) + '/day ' + esc(c.objective)).join(', ')}.` : ''}</p></div>`;
  const url = rlink(g);
  shell('ads', `<div class="page wide"><a href="#ads" class="back"><span class="ar">←</span>Back</a>
    <div class="ptop" style="margin-top:16px"><div class="gcell">${gicon(g, 56)}<div><h2>${esc(g.name)}</h2>
    <div class="stud" style="font-size:12.5px">${esc(s.account)} · universe ${esc(g.universe)} · updated ${esc(s.updated)}${url ? ` · <a href="${url}" target="_blank" rel="noopener">open on Roblox ↗</a>` : ''}</div></div></div>
    <button class="eye ${hiddenSet().has(String(g.universe)) ? 'shut' : ''}" style="position:static;transform:none" onclick="toggleHide('${esc(g.universe)}')"
      title="${hiddenSet().has(String(g.universe)) ? 'Hidden — click to show it in Ads again' : 'Visible — click to hide it from Ads'}">${hiddenSet().has(String(g.universe)) ? EYE.shut : EYE.open}</button></div>
    ${act}${charts}${afterCard}${updCard}${monCard}${spendCard}${body}${foot()}</div>`);
  if (S) drawGChart();
}

// ---------- the game page chart: pick a metric, switch lines on/off, compare with your other games ----------
let GV = null;
const fp1 = v => v == null ? '—' : (v * 100).toFixed(1) + '%';   // share with one decimal (paying players)
const METRICS = [['home', 'Home impressions', fk, true], ['ad', 'Ad impressions', fk, true], ['dau', 'Daily active users', fk, true],
  ['n5', 'Still playing at 5 min', fp, true], ['pt', 'Minutes per new player', v => v == null ? '—' : (+v).toFixed(1), false],
  ['d1', 'Day-1 return', fp, false], ['rev', 'Revenue, R$', fk, false],
  ['arp', 'R$ per player', v => v == null ? '—' : (+v).toFixed(2), false], ['cvr', 'Paying players', fp1, false]];
const CMP_COLORS = ['#9085e9', '#c98500', '#d55181'];
const UPD_COLOR = '#e3b341';   // update markers on the game chart
const UPD_W = 3;   // = siteviews.UPD_WINDOW   // after blue / aqua / orange — validated in this order
window.addEventListener('resize', () => { clearTimeout(window.__gr); window.__gr = setTimeout(() => { if (document.getElementById('gchart')) drawGChart(); }, 150); });
function gvToggle(k) { GV.show[k] = !GV.show[k]; drawGChart(); }
function gvMetric(k) { GV.metric = k; drawGChart(); }
function gvRange(r) { GV.range = r; drawGChart(); }
function gvAdd(u) { if (u && GV.cmp.length < 3 && !GV.cmp.includes(u)) GV.cmp.push(u); drawGChart(); }
function gvDel(u) { GV.cmp = GV.cmp.filter(x => x !== u); drawGChart(); }
function drawGChart() {
  const el = document.getElementById('gchart'); if (!el || !GV) return;
  const g = GV.g, S = g.series, Bm = ME.ads.bench, [mk, mlab, fmt, hasBench] = METRICS.find(m => m[0] === GV.metric);
  const others = allRows().filter(r => r.series && String(r.universe) !== String(g.universe));
  const byU = Object.fromEntries(others.map(r => [String(r.universe), r]));
  const lines = [{k: 'game', name: 'This game', color: SER.game, vals: S[mk]}];
  if (hasBench && Bm) lines.push({k: 'hit', name: `Median hit (${Bm.games.win})`, color: SER.hit, dash: '7 5', vals: Bm['win_' + mk]},
    {k: 'fail', name: `Median fail (${Bm.games.fail})`, color: SER.fail, dash: '2 5', vals: Bm['fail_' + mk]});
  GV.cmp.forEach((u, i) => { const r = byU[u]; if (r) lines.push({k: 'c' + u, u, name: r.name.slice(0, 26), color: CMP_COLORS[i], vals: r.series[mk]}); });
  const shown = lines.filter(l => GV.show[l.k] !== false);
  const full = Math.max(...lines.map(l => (l.vals || []).length), 2);
  const n = GV.range ? Math.min(GV.range, full) : Math.min(full, 60);
  // headline: this game's latest value in range and its change over 7 days (like Roblox's KPI on top of a chart)
  const gv = (S[mk] || []).slice(0, n), li = gv.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
  const last = li != null ? gv[li] : null, prev = li != null && li >= 7 ? gv[li - 7] : null;
  const ch = last != null && prev ? (last - prev) / prev : null;
  const badge = ch == null ? '' : `<span class="kch ${ch >= 0 ? 'up' : 'dn'}">${ch >= 0 ? '↑' : '↓'} ${Math.abs(ch * 100).toFixed(1)}%</span>`;
  const chips = METRICS.map(([k, l]) => `<a class="chip ${GV.metric === k ? 'on' : ''}" onclick="gvMetric('${k}')">${l}</a>`).join('');
  const legend = lines.map(l => `<a class="lgi ${GV.show[l.k] !== false ? '' : 'off'}" onclick="gvToggle('${l.k}')" title="click to show / hide">
    <span class="ldot" style="background:${l.color}"></span>${esc(l.name)}${l.u ? `<span class="x" onclick="event.stopPropagation();gvDel('${l.u}')" title="remove">×</span>` : ''}</a>`).join('')
    + (S.unlock != null ? `<span class="lgi static"><span class="lmk"></span>open to kids · day ${S.unlock}</span>` : '')
    + ((S.ver || []).length ? `<span class="lgi static"><span class="lmk" style="border-color:${UPD_COLOR}"></span>update published (${S.ver.length} day${S.ver.length === 1 ? '' : 's'})</span>` : '');
  const pick = GV.cmp.length < 3 && others.length ? `<select class="inp" style="width:auto;max-width:250px;padding:7px 10px;font-size:12.5px" onchange="gvAdd(this.value)">
    <option value="">+ Compare with another game</option>${others.slice(0, 200).map(r => `<option value="${esc(r.universe)}">${esc(r.name.slice(0, 40))}</option>`).join('')}</select>` : '';
  const ranges = [[21, 'First 21 days'], [0, `All ${Math.min(full, 60)} days`]].map(([r, l]) =>
    `<option value="${r}" ${GV.range === r ? 'selected' : ''}>${l}</option>`).join('');
  const chart = shown.some(l => (l.vals || []).some(v => v != null))
    ? lineChart({n, fmt, series: shown, markers: (S.unlock != null ? [{x: S.unlock, label: 'Opened to kids'}] : [])
        .concat((S.ver || []).map(([x, c]) => ({x, color: UPD_COLOR, label: c > 1 ? `Update published ×${c}` : 'Update published'}))), label: mlab,
        W: Math.max(320, Math.round(el.clientWidth || 900)), H: window.innerWidth < 640 ? 240 : 320})
    : '<p class="stud" style="padding:40px 0;text-align:center">No data for this metric.</p>';
  el.innerHTML = `<div class="chips" style="margin:0 0 16px">${chips}</div>
    <div class="ghead"><div><div class="gtitle">${esc(mlab)}</div><div class="stud" style="font-size:13px;margin-top:2px">Daily, by day since launch${li != null ? ` · latest: day ${li}` : ''}</div>
    <div class="kbig">${last == null ? '—' : fmt(last)} ${badge}</div></div>
    <div class="gctl"><select class="inp" style="width:auto;padding:7px 10px;font-size:12.5px" onchange="gvRange(+this.value)">${ranges}</select>${pick}</div></div>
    ${chart}<div class="legend2">${legend}</div>
    <p class="hint" style="margin:10px 0 0;text-align:center">Day 0 = first day with 20+ players or ads · medians: launches since the 16+ gate${hasBench ? '' : ' (not available for this metric)'} · the change badge compares with 7 days earlier</p>`;
}

// ---------- launches: the pooled playbook (no game names) ----------
const pc = v => (v === null || v === undefined) ? '—' : Math.round(v * 100) + '%';
const kk = v => (v === null || v === undefined) ? '—' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1000 ? Math.round(v / 1000) + 'k' : String(Math.round(v));
function rateCell(r) {
  if (!r || !r.n) return `<td style="text-align:right;color:var(--mut)">—</td>`;
  const p = r.win / r.n, c = p >= .67 ? 'var(--ok)' : p >= .4 ? 'var(--warn)' : 'var(--bad)';
  return `<td style="text-align:right"><b style="color:${c}">${Math.round(p * 100)}%</b> <span class="stud">${r.win}/${r.n}</span></td>`;
}
function bucketTable(title, rows, fmt, note) {
  const body = rows.map(b => `<tr><td class="name">${b.hi === null ? '≥ ' + fmt(b.lo) : fmt(b.lo) + ' – ' + fmt(b.hi)}</td>${rateCell(b)}</tr>`).join('');
  return `<div class="vcard"><div class="lab">${esc(title)}</div>
    <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>range</th><th>took off</th></tr></thead><tbody>${body}</tbody></table></div>
    ${note ? `<p class="hint" style="margin:8px 0 0">${esc(note)}</p>` : ''}</div>`;
}
function oddsTable(o) {   // odds.py: chance to take off by step of the launch
  const rows = [['Days 1–3: D1 under 4%', o.low], ['Days 1–3: D1 4%+, under 7 min per new player', o.mid],
    ['Days 1–3: D1 4%+, 7+ min per new player', o.ok], ['Ignition: Home ≥×1.5 a day for 2 days at 5k+', o.ign]];
  return `<div class="vcard"><div class="lab">Chance to take off — reached 20k Home impressions a day</div>
    <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>what the game showed</th><th>took off</th></tr></thead>
    <tbody>${rows.map(([l, r]) => `<tr><td class="name">${l}</td>${rateCell(r)}</tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:8px 0 0">Share of launches since the 16+ gate that showed the same and took off. Small samples: read “9/19” as “about half”, not as an exact percent.</p></div>`;
}
function launchView() {
  const L = ME.launch, T = L.total, S = L.s1_rule, admin = ME.role === 'admin';
  const kpi = [[T.games, 'games studied'], [L.studios.length, 'studios'], [pc(L.pre.win / L.pre.n), 'took off before the 16+ gate'],
    [pc(L.post.win / L.post.n), 'took off since the gate']]
    .map(([v, l]) => `<div class="kpi"><b>${esc(v)}</b><span>${l}</span></div>`).join('');
  const tk = L.takeaways.map(t => `<li style="margin:6px 0">${esc(t)}</li>`).join('');
  const st = L.studios.map(s => `<tr><td class="name">${esc(s.name)}${admin && s.label ? ` <span class="stud">${esc(s.label)}</span>` : ''}</td>
    <td style="text-align:right">${s.games}</td>${rateCell(s)}${rateCell(s.post)}<td style="text-align:right">${kk(s.win_peak_med)}</td>
    ${rateCell(s.s1.ok)}${rateCell(s.s1.mid)}${rateCell(s.s1.bad)}</tr>`).join('');
  const P = S.pooled;
  const studios = `<div class="vcard"><div class="lab">Studios (anonymised)</div>
    <div class="tbl-wrap"><table><thead><tr><th>studio</th><th>games</th><th>took off (all)</th><th>since the gate</th><th>winner peak DAU (median)</th>
    <th>16+ test good</th><th>borderline</th><th>weak</th></tr></thead><tbody>${st}
    <tr><td class="name"><b>all</b></td><td style="text-align:right">${T.games}</td>${rateCell(T)}${rateCell(L.post)}<td></td>${rateCell(P.ok)}${rateCell(P.mid)}${rateCell(P.bad)}</tr>
    </tbody></table></div>
    <p class="hint" style="margin:8px 0 0">16+ test good = entry ≥${pc(S.ok.entry)}, 5 min ≥${pc(S.ok.n5)}, ≥${S.ok.playtime} min;
    weak = any of entry <${pc(S.bad.entry)}, 5 min <${pc(S.bad.n5)}, <${S.bad.playtime} min. Test columns: games launched since ${esc(L.gate)} (before the 16+ gate there was no adults-only test), older than 3 weeks, 150+ new players on the test.</p></div>`;
  const B = L.buckets;
  const grid = `<p class="hint" style="margin:14px 0 8px">Tables below: games launched since the 16+ gate (${esc(L.gate)}).</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">
    ${L.odds ? oddsTable(L.odds) : ''}
    ${bucketTable('After opening to kids — D1 of Home players (all days)', B.home_d1, pc, 'Averaged over every day after opening, including the take-off itself — it describes hits rather than predicts them. In the first 3 days after opening hits had 5.5–8.6%, like fails.')}
    ${bucketTable('16+ test — still playing at 5 min', B.n5, pc)}
    ${bucketTable('16+ test — minutes per new player', B.playtime, v => v + ' min')}
    ${bucketTable('16+ test — entry (click → play)', B.entry, pc)}</div>`;
  let launch = '';
  if (L.launch && L.launch.after) {
    const A = L.launch.after, Bf = L.launch.before, t = A.timing, tb = Bf ? Bf.timing : null;
    const row = (lab, k, f) => `<tr><td class="name">${lab}</td><td style="text-align:right;color:var(--ok)">${f(t[k].win)}</td><td style="text-align:right;color:var(--bad)">${f(t[k].fail)}</td>`
      + (tb ? `<td style="text-align:right;color:var(--mut);border-left:1px solid var(--line)">${f(tb[k].win)}</td><td style="text-align:right;color:var(--mut)">${f(tb[k].fail)}</td>` : '') + `</tr>`;
    const d = v => (v === null || v === undefined) ? '—' : 'day ' + Math.round(v), n = v => (v === null || v === undefined) ? '—' : String(Math.round(v)), m = v => (v === null || v === undefined) ? '—' : v.toFixed(1);
    const timing = `<div class="vcard"><div class="lab">The first 21 days — medians (${esc(L.launch.from.join(', '))})</div>
      <div class="tbl-wrap"><table style="min-width:0"><thead><tr><th></th><th colspan="2">since the 16+ gate</th>${tb ? '<th colspan="2" style="border-left:1px solid var(--line);color:var(--mut)">before the gate</th>' : ''}</tr>
      <tr><th></th><th style="color:var(--ok)">took off (${A.games.win})</th><th style="color:var(--bad)">failed (${A.games.fail})</th>${tb ? `<th style="border-left:1px solid var(--line)">took off (${Bf.games.win})</th><th>failed (${Bf.games.fail})</th>` : ''}</tr></thead><tbody>
      ${row('ad impressions / day, first 3 days', 'ad_start', kk)}${row('days with ads', 'ad_days', n)}${row('last ad day', 'last_ad_day', d)}
      ${row('Home reaches 10k / day', 'home10k', d)}${row('Home reaches 50k / day', 'home50k', d)}
      ${row('days 1–3: entry', 'f3_entry', pc)}${row('days 1–3: still playing at 5 min', 'f3_n5', pc)}
      ${row('days 1–3: minutes per new player', 'f3_min', m)}${row('days 1–3: D1', 'f3_d1', pc)}
      ${row('last 3 ad days: 5 min', 'tail_n5', pc)}${row('last 3 ad days: minutes', 'tail_min', m)}</tbody></table></div></div>`;
    const tr = A.trajectory.map(r => `<tr><td style="text-align:right">${r.day}</td>
      <td style="text-align:right">${kk(r.win_ad)}</td><td style="text-align:right;color:var(--ok)">${kk(r.win_home)}</td><td style="text-align:right">${kk(r.win_dau)}</td><td style="text-align:right">${pc(r.win_n5)}</td>
      <td style="text-align:right;border-left:1px solid var(--line)">${kk(r.fail_ad)}</td><td style="text-align:right;color:var(--bad)">${kk(r.fail_home)}</td><td style="text-align:right">${kk(r.fail_dau)}</td><td style="text-align:right">${pc(r.fail_n5)}</td></tr>`).join('');
    launch = timing + `<div class="vcard"><div class="lab">Day by day since the gate — median game</div>
      <div class="tbl-wrap"><table><thead><tr><th>day</th><th>ads</th><th>Home</th><th>DAU</th><th>5 min</th>
      <th style="border-left:1px solid var(--line)">ads</th><th>Home</th><th>DAU</th><th>5 min</th></tr>
      <tr><th></th><th colspan="4" style="color:var(--ok)">took off</th><th colspan="4" style="color:var(--bad);border-left:1px solid var(--line)">failed</th></tr></thead>
      <tbody>${tr}</tbody></table></div>
      <p class="hint" style="margin:8px 0 0">Day 0 = first day with 20+ players or ads. Ads and Home = impressions per day.</p></div>`;
  }
  shell('launch', `<div class="page"><div class="ptop"><h2>Launches — what separates hits from flops</h2>
    <span class="stud mono" style="font-size:12.5px">studies as of ${esc(L.as_of)}</span></div>
    <div class="kpis">${kpi}</div>
    <div class="vcard" style="border-left-color:var(--accent);margin-top:14px"><div class="lab">Takeaways</div><ul style="margin:6px 0 0;padding-left:20px">${tk}</ul></div>
    ${adsGuide(L.guide)}${grid}${studios}${launch}
    <p class="hint">Take-off = Home impressions reached 50k a day. Pooled from read-only analytics of several studios; no game names or revenue are shown.</p>${foot()}</div>`);
}

// ---------- admin (read-only here; changes go through the live app) ----------
function adminView() {
  const rows = ME.admin.map(u => {
    const keys = u.keys.map(k => `<div style="margin:3px 0;${k.status === 'deleted' ? 'opacity:.6' : ''}"><b>${esc(k.label)}</b>
      <span style="color:${k.status === 'deleted' ? 'var(--bad)' : 'var(--ok)'};font-size:11px">${esc(k.status)}</span>
      <span class="stud">· since ${esc(k.since)}${k.polled ? ' · collected ' + esc(k.polled) : ''}</span></div>`).join('') || '<span class="stud">—</span>';
    return `<tr><td class="name">${esc(u.name)}</td><td class="stud">${esc(u.role)}</td>
      <td style="color:${u.enabled ? 'var(--ok)' : 'var(--mut)'}">${u.enabled ? 'enabled' : 'disabled'}</td><td class="name" style="text-align:left">${keys}</td>
      <td style="text-align:right;white-space:nowrap">${liveBtn('change role', '/admin', true)} ${liveBtn(u.enabled ? 'disable' : 'enable', '/admin', true)} ${u.keys.some(k => k.status !== 'deleted') ? liveBtn('delete key', '/admin', true) : ''}</td></tr>`;
  }).join('');
  shell('admin', `<div class="page"><div class="ptop"><h2>Admin — logins</h2>
    <span class="stud mono" style="font-size:12.5px">${ME.admin.length} logins</span></div>
    ${liveBar('creating logins, changing roles, disabling them, copying and disconnecting keys')}
    <div class="actions" style="margin:0 0 14px">${liveBtn('Create login', '/admin')} ${liveBtn('Open admin panel', '/admin')}</div>
    <div class="tbl-wrap"><table style="min-width:560px"><thead><tr><th>login</th><th>role</th><th>status</th><th style="text-align:left">connected keys</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="hint">A disabled login stops opening this site on the next publish (every few hours, or right after a collection).</p>${foot()}</div>`);
}

function foot() { return `<footer class="site">Updated ${esc(V.generated)}</footer>`; }

(async () => {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    $app.innerHTML = '<div class="boot">This browser is too old for this page — open it in a current Chrome, Edge, Firefox or Safari.</div>';
    return;
  }
  const k = store.get('ranalytics.k');
  const me = k && await unlock(k);
  if (me) enter(k, me); else { store.del('ranalytics.k'); loginView(); }
})();
</script></body></html>
